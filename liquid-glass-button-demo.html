<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass & Metal Buttons — FitQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", system-ui, sans-serif;
      letter-spacing: -0.015em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen">
  <div id="root"></div>

  <!-- SVG Glass Distortion Filter for LiquidButton -->
  <svg className="hidden" style="display: none;">
    <defs>
      <filter id="container-glass" x="0%" y="0%" width="100%" height="100%" colorInterpolationFilters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
        <feComposite in="finalBlur" in2="finalBlur" operator="over" />
      </filter>
    </defs>
  </svg>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function LiquidButton({ children, onClick, className = "" }) {
      return (
        <button
          onClick={onClick}
          className={`relative inline-flex items-center justify-center cursor-pointer gap-2 whitespace-nowrap rounded-full font-medium transition-all duration-300 hover:scale-105 active:scale-95 px-10 h-14 text-sm text-cyan-300 outline-none select-none ${className}`}
        >
          {/* Specular Liquid Highlights */}
          <div className="absolute top-0 left-0 z-0 h-full w-full rounded-full 
            shadow-[0_0_8px_rgba(0,0,0,0.03),0_2px_6px_rgba(0,0,0,0.08),inset_3px_3px_0.5px_-3.5px_rgba(255,255,255,0.1),inset_-3px_-3px_0.5px_-3.5px_rgba(255,255,255,0.85),inset_1px_1px_1px_-0.5px_rgba(255,255,255,0.6),inset_-1px_-1px_1px_-0.5px_rgba(255,255,255,0.6),inset_0_0_6px_6px_rgba(255,255,255,0.12),inset_0_0_2px_2px_rgba(255,255,255,0.06),0_0_15px_rgba(0,245,212,0.25)] 
            bg-white/[0.04] backdrop-blur-xl border border-white/20 transition-all" />
          
          <div
            className="absolute top-0 left-0 isolate -z-10 h-full w-full overflow-hidden rounded-full"
            style={{ backdropFilter: 'url("#container-glass")' }}
          />

          <span className="relative z-10 flex items-center gap-2 font-bold tracking-wider uppercase text-xs">
            {children}
          </span>
        </button>
      );
    }

    const colorVariants = {
      default: {
        outer: "bg-gradient-to-b from-[#000] to-[#A0A0A0]",
        inner: "bg-gradient-to-b from-[#FAFAFA] via-[#3E3E3E] to-[#E5E5E5]",
        button: "bg-gradient-to-b from-[#B9B9B9] to-[#969696]",
        textColor: "text-white",
        textShadow: "0 -1px 0 rgba(80,80,80,1)",
      },
      primary: {
        outer: "bg-gradient-to-b from-[#002220] to-[#00F5D4]",
        inner: "bg-gradient-to-b from-[#00F5D4] via-[#05262c] to-[#011417]",
        button: "bg-gradient-to-b from-[#00F5D4] to-[#008f7c]",
        textColor: "text-black",
        textShadow: "none",
      },
      gold: {
        outer: "bg-gradient-to-b from-[#917100] to-[#EAD98F]",
        inner: "bg-gradient-to-b from-[#FFFDDD] via-[#856807] to-[#FFF1B3]",
        button: "bg-gradient-to-b from-[#FFEBA1] to-[#9B873F]",
        textColor: "text-[#3D2800]",
        textShadow: "none",
      },
      streak: {
        outer: "bg-gradient-to-b from-[#4a1c00] to-[#FF6B00]",
        inner: "bg-gradient-to-b from-[#FFB074] via-[#6d2800] to-[#260e00]",
        button: "bg-gradient-to-b from-[#FF6B00] to-[#b34000]",
        textColor: "text-white",
        textShadow: "0 -1px 0 rgba(100,20,0,1)",
      },
    };

    function MetalButton({ children, variant = "primary", onClick }) {
      const [isPressed, setIsPressed] = useState(false);
      const [isHovered, setIsHovered] = useState(false);
      const colors = colorVariants[variant] || colorVariants.primary;

      return (
        <div
          className={`relative inline-flex transform-gpu rounded-xl p-[1.25px] transition-all duration-200 cursor-pointer ${colors.outer}`}
          style={{
            transform: isPressed ? "translateY(2px) scale(0.98)" : isHovered ? "translateY(-1px) scale(1.02)" : "scale(1)",
            boxShadow: isPressed ? "0 1px 2px rgba(0,0,0,0.3)" : isHovered ? "0 8px 24px rgba(0,245,212,0.2)" : "0 4px 12px rgba(0,0,0,0.25)"
          }}
          onMouseDown={() => setIsPressed(true)}
          onMouseUp={() => setIsPressed(false)}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => { setIsHovered(false); setIsPressed(false); }}
          onClick={onClick}
        >
          <div className={`absolute inset-[1px] rounded-lg transition-all ${colors.inner}`} style={{ filter: isHovered ? "brightness(1.08)" : "none" }}></div>
          <button
            className={`relative z-10 m-[1px] inline-flex h-12 items-center justify-center rounded-lg px-8 text-xs font-bold tracking-wider uppercase ${colors.button} ${colors.textColor}`}
            style={{ textShadow: colors.textShadow }}
          >
            {children}
          </button>
        </div>
      );
    }

    function App() {
      const [clicks, setClicks] = useState(0);

      return (
        <div className="relative min-h-screen w-full flex flex-col justify-between p-8 sm:p-12 overflow-hidden">
          {/* Ambient Background */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none -z-10" />

          {/* Top Header */}
          <div className="flex items-center justify-between z-10">
            <div className="flex items-center gap-3">
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" />
              <span className="font-mono text-xs text-cyan-400 uppercase tracking-widest font-bold">
                FITQUEST // LIQUID GLASS & TACTILE METAL BUTTONS
              </span>
            </div>
            <div className="font-mono text-xs text-white/50">
              CLICKS REGISTERED: <span className="text-cyan-400 font-bold">{clicks}</span>
            </div>
          </div>

          {/* Button Showcase */}
          <div className="flex flex-col items-center justify-center text-center max-w-4xl mx-auto z-10 space-y-12 my-auto">
            <div className="space-y-4">
              <span className="px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-mono uppercase tracking-widest text-white/80">
                SHADCN BUTTON SYSTEM PRIMITIVES
              </span>
              <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight uppercase leading-tight">
                TACTILE LIQUID BUTTONS
              </h1>
              <p className="text-neutral-400 text-sm max-w-xl mx-auto">
                Optical physics, refractive SVG turbulence distortion, and spring physics engineered for high-conversion call-to-actions.
              </p>
            </div>

            {/* Liquid Glass Showcase */}
            <div className="p-8 rounded-3xl bg-white/[0.02] border border-white/10 backdrop-blur-xl w-full space-y-6">
              <span className="text-xs font-mono text-white/50 uppercase tracking-widest block">
                1. LIQUID GLASS ACTION BUTTON (PRIMARY HERO CTA)
              </span>
              <div className="flex flex-wrap items-center justify-center gap-6">
                <LiquidButton onClick={() => setClicks(c => c + 1)}>
                  <span>✦ START 1-ON-1 COACHING</span>
                </LiquidButton>
                <LiquidButton onClick={() => setClicks(c => c + 1)}>
                  <span>⚡ CLAIM FOUNDING PASS (+500 XP)</span>
                </LiquidButton>
              </div>
            </div>

            {/* Tactile Metal Showcase */}
            <div className="p-8 rounded-3xl bg-white/[0.02] border border-white/10 backdrop-blur-xl w-full space-y-6">
              <span className="text-xs font-mono text-white/50 uppercase tracking-widest block">
                2. METAL BUTTON VARIANTS (TIERS & ACTIONS)
              </span>
              <div className="flex flex-wrap items-center justify-center gap-6">
                <MetalButton variant="primary" onClick={() => setClicks(c => c + 1)}>
                  CYAN TITANIUM
                </MetalButton>
                <MetalButton variant="gold" onClick={() => setClicks(c => c + 1)}>
                  APEX GOLD
                </MetalButton>
                <MetalButton variant="streak" onClick={() => setClicks(c => c + 1)}>
                  STREAK EMBER
                </MetalButton>
                <MetalButton variant="default" onClick={() => setClicks(c => c + 1)}>
                  STEEL MONO
                </MetalButton>
              </div>
            </div>
          </div>

          {/* Footer Status */}
          <div className="text-center font-mono text-xs text-white/40 z-10 uppercase tracking-widest">
            READY FOR LANDING PAGE ARCHITECTURE INTEGRATION →
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
