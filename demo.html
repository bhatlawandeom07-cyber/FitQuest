<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Motion Footer — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#040407',
            foreground: '#E2E8F0',
            primary: '#00F5D4',
            secondary: '#FF6B00',
            destructive: '#FF2E55',
            muted: '#141724',
            'muted-foreground': '#8E95AA',
            border: 'rgba(255, 255, 255, 0.1)',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary/20 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef } = React;
    if (typeof window !== "undefined") {
      gsap.registerPlugin(ScrollTrigger);
    }

    const STYLES = `
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

    .cinematic-footer-wrapper {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      --pill-bg-1: color-mix(in oklch, var(--foreground) 3%, transparent);
      --pill-bg-2: color-mix(in oklch, var(--foreground) 1%, transparent);
      --pill-shadow: color-mix(in oklch, var(--background) 50%, transparent);
      --pill-highlight: color-mix(in oklch, var(--foreground) 10%, transparent);
      --pill-inset-shadow: color-mix(in oklch, var(--background) 80%, transparent);
      --pill-border: color-mix(in oklch, var(--foreground) 8%, transparent);
      --pill-bg-1-hover: color-mix(in oklch, var(--foreground) 8%, transparent);
      --pill-bg-2-hover: color-mix(in oklch, var(--foreground) 2%, transparent);
      --pill-border-hover: color-mix(in oklch, var(--foreground) 20%, transparent);
      --pill-shadow-hover: color-mix(in oklch, var(--background) 70%, transparent);
      --pill-highlight-hover: color-mix(in oklch, var(--foreground) 20%, transparent);
    }

    @keyframes footer-breathe {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    @keyframes footer-scroll-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes footer-heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px color-mix(in oklch, #FF2E55 50%, transparent)); }
      15%, 45% { transform: scale(1.2); filter: drop-shadow(0 0 10px color-mix(in oklch, #FF2E55 80%, transparent)); }
      30% { transform: scale(1); }
    }

    .animate-footer-breathe { animation: footer-breathe 8s ease-in-out infinite alternate; }
    .animate-footer-scroll-marquee { animation: footer-scroll-marquee 40s linear infinite; }
    .animate-footer-heartbeat { animation: footer-heartbeat 2s cubic-bezier(0.25, 1, 0.5, 1) infinite; }

    .footer-bg-grid {
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, color-mix(in oklch, var(--foreground) 3%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in oklch, var(--foreground) 3%, transparent) 1px, transparent 1px);
      mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    }

    .footer-aurora {
      background: radial-gradient(circle at 50% 50%, color-mix(in oklch, #00F5D4 15%, transparent) 0%, color-mix(in oklch, #8A2BE2 15%, transparent) 40%, transparent 70%);
    }

    .footer-glass-pill {
      background: linear-gradient(145deg, var(--pill-bg-1) 0%, var(--pill-bg-2) 100%);
      box-shadow: 0 10px 30px -10px var(--pill-shadow), inset 0 1px 1px var(--pill-highlight), inset 0 -1px 2px var(--pill-inset-shadow);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .footer-glass-pill:hover {
      background: linear-gradient(145deg, var(--pill-bg-1-hover) 0%, var(--pill-bg-2-hover) 100%);
      border-color: var(--pill-border-hover);
      box-shadow: 0 20px 40px -10px var(--pill-shadow-hover), inset 0 1px 1px var(--pill-highlight-hover);
      color: var(--foreground);
    }

    .footer-giant-bg-text {
      font-size: 26vw;
      line-height: 0.75;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: transparent;
      -webkit-text-stroke: 1px color-mix(in oklch, var(--foreground) 5%, transparent);
      background: linear-gradient(180deg, color-mix(in oklch, var(--foreground) 10%, transparent) 0%, transparent 60%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .footer-text-glow {
      background: linear-gradient(180deg, var(--foreground) 0%, color-mix(in oklch, var(--foreground) 40%, transparent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0px 0px 20px color-mix(in oklch, var(--foreground) 15%, transparent));
    }
    `;

    function MagneticButton({ className, children, as: Component = "button", ...props }) {
      const localRef = useRef(null);

      useEffect(() => {
        if (typeof window === "undefined") return;
        const element = localRef.current;
        if (!element) return;

        const handleMouseMove = (e) => {
          const rect = element.getBoundingClientRect();
          const h = rect.width / 2;
          const w = rect.height / 2;
          const x = e.clientX - rect.left - h;
          const y = e.clientY - rect.top - w;
          gsap.to(element, { x: x * 0.4, y: y * 0.4, rotationX: -y * 0.15, rotationY: x * 0.15, scale: 1.05, ease: "power2.out", duration: 0.4 });
        };

        const handleMouseLeave = () => {
          gsap.to(element, { x: 0, y: 0, rotationX: 0, rotationY: 0, scale: 1, ease: "elastic.out(1, 0.3)", duration: 1.2 });
        };

        element.addEventListener("mousemove", handleMouseMove);
        element.addEventListener("mouseleave", handleMouseLeave);
        return () => {
          element.removeEventListener("mousemove", handleMouseMove);
          element.removeEventListener("mouseleave", handleMouseLeave);
        };
      }, []);

      return (
        <Component ref={localRef} className={`cursor-pointer ${className || ''}`} {...props}>
          {children}
        </Component>
      );
    }

    const MarqueeItem = () => (
      <div className="flex items-center space-x-12 px-6">
        <span>Accountability Redefined</span> <span className="text-primary/60">✦</span>
        <span>Transparent Tracking</span> <span className="text-secondary/60">✦</span>
        <span>12-Step Progress</span> <span className="text-primary/60">✦</span>
        <span>Sponsor Connection</span> <span className="text-secondary/60">✦</span>
        <span>Absolute Privacy</span> <span className="text-primary/60">✦</span>
      </div>
    );

    function CinematicFooter() {
      const wrapperRef = useRef(null);
      const giantTextRef = useRef(null);
      const headingRef = useRef(null);
      const linksRef = useRef(null);

      useEffect(() => {
        if (typeof window === "undefined" || !wrapperRef.current) return;
        const ctx = gsap.context(() => {
          gsap.fromTo(giantTextRef.current,
            { y: "10vh", scale: 0.8, opacity: 0 },
            { y: "0vh", scale: 1, opacity: 1, ease: "power1.out", scrollTrigger: { trigger: wrapperRef.current, start: "top 80%", end: "bottom bottom", scrub: 1 } }
          );
          gsap.fromTo([headingRef.current, linksRef.current],
            { y: 50, opacity: 0 },
            { y: 0, opacity: 1, stagger: 0.15, ease: "power3.out", scrollTrigger: { trigger: wrapperRef.current, start: "top 40%", end: "bottom bottom", scrub: 1 } }
          );
        }, wrapperRef);
        return () => ctx.revert();
      }, []);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <>
          <style dangerouslySetInnerHTML={{ __html: STYLES }} />
          <div ref={wrapperRef} className="relative h-screen w-full" style={{ clipPath: "polygon(0% 0, 100% 0%, 100% 100%, 0 100%)" }}>
            <footer className="fixed bottom-0 left-0 flex h-screen w-full flex-col justify-between overflow-hidden bg-background text-foreground cinematic-footer-wrapper">
              <div className="footer-aurora absolute left-1/2 top-1/2 h-[60vh] w-[80vw] -translate-x-1/2 -translate-y-1/2 animate-footer-breathe rounded-[50%] blur-[80px] pointer-events-none z-0" />
              <div className="footer-bg-grid absolute inset-0 z-0 pointer-events-none" />
              <div ref={giantTextRef} className="footer-giant-bg-text absolute -bottom-[5vh] left-1/2 -translate-x-1/2 whitespace-nowrap z-0 pointer-events-none select-none">
                FITQUEST
              </div>
              <div className="absolute top-12 left-0 w-full overflow-hidden border-y border-border/50 bg-background/60 backdrop-blur-md py-4 z-10 -rotate-2 scale-110 shadow-2xl">
                <div className="flex w-max animate-footer-scroll-marquee text-xs md:text-sm font-bold tracking-[0.3em] text-muted-foreground uppercase">
                  <MarqueeItem />
                  <MarqueeItem />
                </div>
              </div>
              <div className="relative z-10 flex flex-1 flex-col items-center justify-center px-6 mt-20 w-full max-w-5xl mx-auto">
                <h2 ref={headingRef} className="text-5xl md:text-8xl font-black footer-text-glow tracking-tighter mb-12 text-center">
                  Ready to begin?
                </h2>
                <div ref={linksRef} className="flex flex-col items-center gap-6 w-full">
                  <div className="flex flex-wrap justify-center gap-4 w-full">
                    <MagneticButton as="a" href="#" className="footer-glass-pill px-10 py-5 rounded-full text-foreground font-bold text-sm md:text-base flex items-center gap-3 group">
                      Download iOS
                    </MagneticButton>
                    <MagneticButton as="a" href="#" className="footer-glass-pill px-10 py-5 rounded-full text-foreground font-bold text-sm md:text-base flex items-center gap-3 group">
                      Download Android
                    </MagneticButton>
                  </div>
                  <div className="flex flex-wrap justify-center gap-3 md:gap-6 w-full mt-2">
                    <MagneticButton as="a" href="#" className="footer-glass-pill px-6 py-3 rounded-full text-muted-foreground font-medium text-xs md:text-sm hover:text-foreground">Privacy Policy</MagneticButton>
                    <MagneticButton as="a" href="#" className="footer-glass-pill px-6 py-3 rounded-full text-muted-foreground font-medium text-xs md:text-sm hover:text-foreground">Terms of Service</MagneticButton>
                    <MagneticButton as="a" href="#" className="footer-glass-pill px-6 py-3 rounded-full text-muted-foreground font-medium text-xs md:text-sm hover:text-foreground">Support</MagneticButton>
                  </div>
                </div>
              </div>
              <div className="relative z-20 w-full pb-8 px-6 md:px-12 flex flex-col md:flex-row items-center justify-between gap-6">
                <div className="text-muted-foreground text-[10px] md:text-xs font-semibold tracking-widest uppercase order-2 md:order-1">
                  &copy; 2026 FitQuest Technologies Inc. All rights reserved.
                </div>
                <div className="footer-glass-pill px-6 py-3 rounded-full flex items-center gap-2 order-1 md:order-2 cursor-default border-border/50">
                  <span className="text-muted-foreground text-[10px] md:text-xs font-bold uppercase tracking-widest">Crafted with</span>
                  <span className="animate-footer-heartbeat text-sm md:text-base text-destructive">❤</span>
                  <span className="text-muted-foreground text-[10px] md:text-xs font-bold uppercase tracking-widest">by</span>
                  <span className="text-foreground font-black text-xs md:text-sm tracking-normal ml-1">FitQuest</span>
                </div>
                <MagneticButton as="button" onClick={scrollToTop} className="w-12 h-12 rounded-full footer-glass-pill flex items-center justify-center text-muted-foreground hover:text-foreground group order-3">
                  ↑
                </MagneticButton>
              </div>
            </footer>
          </div>
        </>
      );
    }

    function DemoApp() {
      return (
        <div className="relative w-full bg-background min-h-screen font-sans selection:bg-white/20 overflow-x-hidden">
          <main className="relative z-10 w-full min-h-[120vh] bg-background flex flex-col items-center justify-center text-white border-b border-white/10 shadow-md rounded-b-3xl">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top_center,rgba(255,255,255,0.03)_0%,transparent_60%)] pointer-events-none" />
            <h1 className="text-4xl md:text-5xl font-light tracking-[0.2em] text-neutral-400 mb-8 uppercase text-center px-4">
              Scroll down to reveal
            </h1>
            <div className="w-[1px] h-32 bg-gradient-to-b from-neutral-400 to-transparent" />
          </main>
          <CinematicFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DemoApp />);
  </script>
</body>
</html>
