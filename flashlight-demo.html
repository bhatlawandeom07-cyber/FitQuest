<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashlight Text Reveal — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #000; overflow-x: hidden; }
  </style>
</head>
<body class="bg-black text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const SPOTLIGHT = 4;
    const VERT = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
    `;

    const FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    uniform vec3 u_colors[8];
    uniform vec4 u_scene;
    uniform vec4 u_shape;
    uniform vec4 u_surface;
    uniform vec4 u_finish;
    uniform vec4 u_transform;
    uniform vec4 u_space;
    uniform vec4 u_cursor;

    #define u_resolution u_scene.xy
    #define u_time u_scene.z
    #define u_colorCount u_scene.w
    #define u_scale u_shape.x
    #define u_intensity u_shape.y
    #define u_paramA u_shape.z
    #define u_warp u_shape.w
    #define u_detail u_surface.x
    #define u_contrast u_surface.y
    #define u_brightness u_surface.z
    #define u_saturation u_surface.w
    #define u_hue u_finish.x
    #define u_vignette u_finish.y
    #define u_blur u_finish.z
    #define u_grain u_finish.w
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    #define u_seed u_transform.x
    #else
    #define u_seed mod(u_transform.x, 31.0)
    #endif
    #define u_rotate u_transform.y
    #define u_drift u_transform.z
    #define u_oklab u_transform.w
    #define u_offset u_space.xy
    #define u_mouse u_space.zw
    #define u_cursorPresence u_cursor.x
    #define u_cursorEffect u_cursor.y
    #define u_cursorStrength u_cursor.z
    #define u_cursorRadius u_cursor.w

    float hash21(vec2 p) {
    #ifndef GL_FRAGMENT_PRECISION_HIGH
      p = mod(p, 31.0);
    #endif
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }

    float grainHash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
        u.y);
    }

    vec3 shade(vec2 uv, vec2 p, float t) {
      vec3 acc = u_colors[0] * 0.15;
      float total = 0.15;
      for (int i = 0; i < 8; i++) {
        if (float(i) >= u_colorCount) break;
        float fi = float(i);
        vec2 c = vec2(
          sin(t * (0.21 + fi * 0.071) + fi * 2.4 + u_seed),
          cos(t * (0.17 + fi * 0.093) + fi * 1.7)) * (0.45 + u_intensity * 0.35);
        float w = exp(-dot(p - c, p - c) * 6.0);
        acc += u_colors[i] * w;
        total += w;
      }
      return acc / total;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 screenUv = uv;
      vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
      float cursorMask = 0.0;

      if (u_cursorPresence > 0.001) {
        vec2 cursor = (0.5 * u_mouse * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 cursorDelta = p - cursor;
        float cursorDistance = length(cursorDelta);
        cursorMask = u_cursorPresence * (1.0 - smoothstep(0.0, u_cursorRadius, cursorDistance));
      }

      uv = p * min(u_resolution.x, u_resolution.y) / u_resolution.xy + 0.5;
      p *= u_scale;
      vec3 col = shade(uv, p, u_time);
      if (u_cursorPresence > 0.001 && u_cursorEffect > 3.5)
        col += (vec3(0.18) + col * 0.12) * cursorMask * u_cursorStrength;
      if (u_grain > 0.0001)
        col += (grainHash(gl_FragCoord.xy + vec2(u_seed * 17.0, u_seed * 31.0)) - 0.5) * u_grain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
    `;

    function hexToRgb(hex) {
      let h = hex.trim().replace(/^#/, "");
      if (h.length === 3) h = h.replace(/./g, "$&$&");
      const n = /^[0-9a-f]{6}$/i.test(h) ? parseInt(h, 16) : 0;
      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
    }

    const FALLOFF = [1, 0.84375, 0.5, 0.15625, 0];

    function lightMask(x, y, radius, presence, ghost) {
      const stops = FALLOFF.map(
        (f, i) => "rgba(0,0,0," + (ghost + (1 - ghost) * f * presence).toFixed(3) + ") " + i * 25 + "%",
      );
      return (
        "radial-gradient(circle " + Math.max(radius, 1).toFixed(1) + "px at " +
        x.toFixed(1) + "px " + y.toFixed(1) + "px, " + stops.join(", ") + ")"
      );
    }

    function wanderAt(t) {
      return [0.62 * Math.sin(t * 0.37), 0.5 * Math.sin(t * 0.53 + 1.3)];
    }

    function compile(gl, vert, frag) {
      const program = gl.createProgram();
      if (!program) return null;
      for (const [type, source] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
        const shader = gl.createShader(type);
        if (!shader) return null;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          gl.deleteShader(shader);
          return null;
        }
        gl.attachShader(program, shader);
        gl.deleteShader(shader);
      }
      gl.linkProgram(program);
      return program;
    }

    function FlashlightTextReveal({
      text = "WHAT YOU\nSEEK IS\nSEEKING\nYOU",
      textColor = "#ececec",
      ghost = 0.04,
      fontFamily = '"Anton", Impact, sans-serif',
      fontSize = "clamp(3.5rem, 14vw, 11rem)",
      wander = true,
      radius = 0.35,
      strength = 1,
      colors = ["#08080C", "#252836", "#00F5D4"],
      speed = 0.86,
      scale = 2.5,
      height = "100vh"
    }) {
      const canvasRef = React.useRef(null);
      const writingRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const gl = canvas.getContext("webgl");
        if (!gl) return;
        const program = compile(gl, VERT, FRAG);
        if (!program) return;

        const triangleBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const position = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
        gl.useProgram(program);

        const u = (name) => gl.getUniformLocation(program, name);
        const loc = {
          colors: u("u_colors"),
          scene: u("u_scene"),
          shape: u("u_shape"),
          surface: u("u_surface"),
          finish: u("u_finish"),
          transform: u("u_transform"),
          space: u("u_space"),
          cursor: u("u_cursor"),
        };
        const colorData = new Float32Array(24);
        colors.forEach((hex, i) => colorData.set(hexToRgb(hex), i * 3));

        const pointer = { x: 0, y: 0, inside: false };
        const light = { x: 0, y: 0 };
        let presence = 0, time = 0, roam = 0, last = 0, raf = 0;

        const draw = (now) => {
          const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
          last = now;
          if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
          }
          time += dt * speed;
          roam += dt;

          const [tx, ty] = pointer.inside ? [pointer.x, pointer.y] : wander ? wanderAt(roam) : [0, 0];
          const on = pointer.inside || wander ? 1 : 0;
          light.x += (tx - light.x) * (1 - Math.exp(-dt / 0.15));
          light.y += (ty - light.y) * (1 - Math.exp(-dt / 0.15));
          presence += (on - presence) * (1 - Math.exp(-dt / 0.25));

          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform3fv(loc.colors, colorData);
          gl.uniform4f(loc.scene, canvas.width, canvas.height, time, colors.length);
          gl.uniform4f(loc.shape, scale, 0.59, 0.5, 0);
          gl.uniform4f(loc.surface, 2.4, 0.91, -0.1, 1);
          gl.uniform4f(loc.finish, 6.28, 0, 0.016, 0.16);
          gl.uniform4f(loc.transform, 1, 0, 0.03, 0);
          gl.uniform4f(loc.space, 0, 0, light.x, light.y);
          gl.uniform4f(loc.cursor, presence, SPOTLIGHT, strength, radius);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          if (writingRef.current) {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const mask = lightMask(((light.x + 1) / 2) * w, ((1 - light.y) / 2) * h, radius * Math.min(w, h), presence, ghost);
            writingRef.current.style.maskImage = mask;
            writingRef.current.style.webkitMaskImage = mask;
          }
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);

        const onMove = (e) => {
          const r = canvas.getBoundingClientRect();
          pointer.inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
          pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          pointer.y = 1 - ((e.clientY - r.top) / r.height) * 2;
        };
        window.addEventListener("pointermove", onMove);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener("pointermove", onMove);
        };
      }, []);

      return (
        <section className="relative w-full overflow-hidden" style={{ height, background: colors[0] }}>
          <canvas ref={canvasRef} className="pointer-events-none absolute inset-0 block h-full w-full" />
          <div
            ref={writingRef}
            className="absolute inset-0 flex items-center justify-center px-6 text-center select-none"
            style={{
              color: textColor,
              fontFamily,
              fontSize,
              lineHeight: 0.88,
              letterSpacing: "0.01em",
              whiteSpace: "pre-line",
            }}
          >
            <p className="m-0 font-normal uppercase">{text}</p>
          </div>
          <div className="absolute top-6 left-6 z-20 text-xs font-mono text-white/50 tracking-widest uppercase">
            [ MOVE POINTER TO EXPLORE WITH FLASHLIGHT ]
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FlashlightTextReveal text="FITQUEST&#10;TRANSCEND&#10;YOUR&#10;LIMITS" />);
  </script>
</body>
</html>
