    /**
     * ============================================================================
     * 1. RandomLetterSwap Component (components/ui/random-letter-swap.tsx)
     * ============================================================================
     */
    const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    function RandomLetterSwap({ label, className = "", staggerDuration = 0.025 }) {
      const [displayText, setDisplayText] = useState(label);
      const intervalRef = useRef(null);

      const startScramble = () => {
        let iteration = 0;
        const maxIterations = label.length * 3;
        if (intervalRef.current) clearInterval(intervalRef.current);

        intervalRef.current = setInterval(() => {
          setDisplayText(
            label
              .split("")
              .map((letter, index) => {
                if (letter === " ") return " ";
                if (index < iteration / 3) return label[index];
                return CHARS[Math.floor(Math.random() * CHARS.length)];
              })
              .join("")
          );

          if (iteration >= maxIterations) {
            if (intervalRef.current) clearInterval(intervalRef.current);
            setDisplayText(label);
          }
          iteration += 1;
        }, Math.max(20, staggerDuration * 1000));
      };

      useEffect(() => {
        setDisplayText(label);
        return () => {
          if (intervalRef.current) clearInterval(intervalRef.current);
        };
      }, [label]);

      return (
        <span
          onMouseEnter={startScramble}
          className={`inline-block font-medium transition-colors duration-200 select-none ${className}`}
        >
          {displayText}
        </span>
      );
    }

    /**
     * ============================================================================
     * Flashlight Shader Constants & Helper Functions
     * ============================================================================
     */
    const SPOTLIGHT = 4;

    const FLASHLIGHT_VERT = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
    `;

    const FLASHLIGHT_FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    uniform vec3 u_colors[8];
    uniform vec4 u_scene;
    uniform vec4 u_shape;
    uniform vec4 u_surface;
    uniform vec4 u_finish;
    uniform vec4 u_transform;
    uniform vec4 u_space;
    uniform vec4 u_cursor;

    #define u_resolution u_scene.xy
    #define u_time u_scene.z
    #define u_colorCount u_scene.w
    #define u_scale u_shape.x
    #define u_intensity u_shape.y
    #define u_paramA u_shape.z
    #define u_warp u_shape.w
    #define u_detail u_surface.x
    #define u_contrast u_surface.y
    #define u_brightness u_surface.z
    #define u_saturation u_surface.w
    #define u_hue u_finish.x
    #define u_vignette u_finish.y
    #define u_blur u_finish.z
    #define u_grain u_finish.w
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    #define u_seed u_transform.x
    #else
    #define u_seed mod(u_transform.x, 31.0)
    #endif
    #define u_rotate u_transform.y
    #define u_drift u_transform.z
    #define u_oklab u_transform.w
    #define u_offset u_space.xy
    #define u_mouse u_space.zw
    #define u_cursorPresence u_cursor.x
    #define u_cursorEffect u_cursor.y
    #define u_cursorStrength u_cursor.z
    #define u_cursorRadius u_cursor.w

    float hash21(vec2 p) {
    #ifndef GL_FRAGMENT_PRECISION_HIGH
      p = mod(p, 31.0);
    #endif
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }

    float grainHash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
        u.y);
    }

    vec3 shade(vec2 uv, vec2 p, float t) {
      vec3 acc = u_colors[0] * 0.15;
      float total = 0.15;
      for (int i = 0; i < 8; i++) {
        if (float(i) >= u_colorCount) break;
        float fi = float(i);
        vec2 c = vec2(
          sin(t * (0.21 + fi * 0.071) + fi * 2.4 + u_seed),
          cos(t * (0.17 + fi * 0.093) + fi * 1.7)) * (0.45 + u_intensity * 0.35);
        float w = exp(-dot(p - c, p - c) * 6.0);
        acc += u_colors[i] * w;
        total += w;
      }
      return acc / total;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 screenUv = uv;
      vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
      float cursorMask = 0.0;

      if (u_cursorPresence > 0.001) {
        vec2 cursor = (0.5 * u_mouse * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 cursorDelta = p - cursor;
        float cursorDistance = length(cursorDelta);
        cursorMask = u_cursorPresence * (1.0 - smoothstep(0.0, u_cursorRadius, cursorDistance));
      }

      uv = p * min(u_resolution.x, u_resolution.y) / u_resolution.xy + 0.5;
      p *= u_scale;
      vec3 col = shade(uv, p, u_time);
      if (u_cursorPresence > 0.001 && u_cursorEffect > 3.5)
        col += (vec3(0.18) + col * 0.12) * cursorMask * u_cursorStrength;
      if (u_grain > 0.0001)
        col += (grainHash(gl_FragCoord.xy + vec2(u_seed * 17.0, u_seed * 31.0)) - 0.5) * u_grain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
    `;

    function fl_hexToRgb(hex) {
      let h = hex.trim().replace(/^#/, "");
      if (h.length === 3) h = h.replace(/./g, "$&$&");
      const n = /^[0-9a-f]{6}$/i.test(h) ? parseInt(h, 16) : 0;
      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
    }

    const FL_FALLOFF = [1, 0.84375, 0.5, 0.15625, 0];

    function fl_lightMask(x, y, radius, presence, ghost) {
      const stops = FL_FALLOFF.map(
        (f, i) => "rgba(0,0,0," + (ghost + (1 - ghost) * f * presence).toFixed(3) + ") " + i * 25 + "%",
      );
      return (
        "radial-gradient(circle " + Math.max(radius, 1).toFixed(1) + "px at " +
        x.toFixed(1) + "px " + y.toFixed(1) + "px, " + stops.join(", ") + ")"
      );
    }

    function fl_wanderAt(t) {
      return [0.62 * Math.sin(t * 0.37), 0.5 * Math.sin(t * 0.53 + 1.3)];
    }

    function fl_compile(gl, vert, frag) {
      const program = gl.createProgram();
      if (!program) return null;
      for (const [type, source] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
        const shader = gl.createShader(type);
        if (!shader) return null;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          gl.deleteShader(shader);
          return null;
        }
        gl.attachShader(program, shader);
        gl.deleteShader(shader);
      }
      gl.linkProgram(program);
      return program;
    }

    /**
     * ============================================================================
     * 4. FlashlightTextReveal Component (components/ui/flashlight-text-reveal.tsx)
     * ============================================================================
     */
    function FlashlightTextReveal({
      text = "FITQUEST\nTRANSCEND\nYOUR\nLIMITS",
      textColor = "#f4f4f5",
      ghost = 0.08,
      fontFamily = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", system-ui, sans-serif',
      fontSize = "clamp(3.5rem, 12vw, 10rem)",
      fontWeight = "900",
      wander = true,
      radius = 0.36,
      strength = 1.2,
      colors = ["#08080C", "#252836", "#00F5D4"],
      speed = 0.86,
      scale = 2.5,
      height = "100vh",
      children,
    }) {
      const canvasRef = useRef(null);
      const writingRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
        if (!gl) return;
        const program = fl_compile(gl, FLASHLIGHT_VERT, FLASHLIGHT_FRAG);
        if (!program) return;

        const triangleBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

        const aPosition = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        const uColors = gl.getUniformLocation(program, "u_colors");
        const uScene = gl.getUniformLocation(program, "u_scene");
        const uShape = gl.getUniformLocation(program, "u_shape");
        const uSurface = gl.getUniformLocation(program, "u_surface");
        const uFinish = gl.getUniformLocation(program, "u_finish");
        const uTransform = gl.getUniformLocation(program, "u_transform");
        const uSpace = gl.getUniformLocation(program, "u_space");
        const uCursor = gl.getUniformLocation(program, "u_cursor");

        const colorFloats = new Float32Array(24);
        colors.slice(0, 8).forEach((c, i) => {
          const rgb = fl_hexToRgb(c);
          colorFloats[i * 3] = rgb[0];
          colorFloats[i * 3 + 1] = rgb[1];
          colorFloats[i * 3 + 2] = rgb[2];
        });

        let raf = 0;
        let lastTime = performance.now();
        let simTime = 0;
        let mouseX = 0;
        let mouseY = 0;
        let targetPresence = 0;
        let presence = 0;

        const onMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
            targetPresence = 1;
            mouseX = (e.clientX - rect.left) / rect.width;
            mouseY = (e.clientY - rect.top) / rect.height;
          } else {
            targetPresence = 0;
          }
        };

        window.addEventListener("pointermove", onMove);

        const render = (now) => {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          simTime += dt * speed;
          presence += (targetPresence - presence) * Math.min(dt * 8, 1);

          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            gl.viewport(0, 0, w, h);
          }

          let px = mouseX;
          let py = mouseY;
          let effectivePresence = presence;

          if (wander && effectivePresence < 0.999) {
            const [wx, wy] = fl_wanderAt(simTime);
            px = px * effectivePresence + (0.5 + wx * 0.45) * (1 - effectivePresence);
            py = py * effectivePresence + (0.5 + wy * 0.45) * (1 - effectivePresence);
            effectivePresence = 1;
          }

          const lightRadiusPx = radius * Math.min(w, h);
          const writingEl = writingRef.current;
          if (writingEl) {
            const mask = fl_lightMask(px * w, py * h, lightRadiusPx, effectivePresence, ghost);
            writingEl.style.maskImage = mask;
            writingEl.style.webkitMaskImage = mask;
          }

          gl.useProgram(program);
          gl.uniform3fv(uColors, colorFloats);
          gl.uniform4f(uScene, w, h, simTime, colors.length);
          gl.uniform4f(uShape, scale, 0.59, 0, 0);
          gl.uniform4f(uSurface, 0.4, 1.0, 0, 0);
          gl.uniform4f(uFinish, 0, 0.05, 0, 0.05);
          gl.uniform4f(uTransform, 1, 0, 0.03, 0);
          gl.uniform4f(uSpace, 0, 0, (px - 0.5) * 2, -(py - 0.5) * 2);
          gl.uniform4f(uCursor, effectivePresence, SPOTLIGHT, strength, radius);

          gl.drawArrays(gl.TRIANGLES, 0, 3);
          raf = requestAnimationFrame(render);
        };

        raf = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener("pointermove", onMove);
          gl.deleteBuffer(triangleBuffer);
          gl.deleteProgram(program);
        };
      }, []);

      return (
        <section className="relative w-full h-screen overflow-hidden select-none bg-black">
          <canvas ref={canvasRef} className="pointer-events-none absolute inset-0 block h-full w-full z-0" />
          <div
            ref={writingRef}
            className="absolute inset-0 flex items-center justify-center px-6 text-center select-none pointer-events-none z-10"
            style={{
              color: textColor,
              fontFamily,
              fontSize,
              fontWeight,
              lineHeight: 0.92,
              letterSpacing: "-0.035em",
              whiteSpace: "pre-line",
            }}
          >
            <p className="m-0 font-extrabold uppercase">{text}</p>
          </div>
          {children && <div className="relative z-20 h-full w-full pointer-events-none">{children}</div>}
        </section>
      );
    }

    function CarouselStacked() {
      const [progress, setProgress] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startX = useRef(0);
      const startProgress = useRef(0);
      const total = slidesData.length;

      const handleMouseDown = (e) => {
        setIsDragging(true);
        startX.current = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        startProgress.current = progress;
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const delta = currentX - startX.current;
        setProgress(startProgress.current - delta / 180);
      };

      const handleMouseUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        setProgress(Math.round(progress));
      };

      return (
        <div className="flex flex-col items-center justify-center w-full py-12 select-none overflow-hidden">
          <div className="text-center mb-6">
            <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
              SYNOPSIS PILLAR // 3D CARDS STACK
            </span>
            <h3 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">
              Biomechanical Architecture
            </h3>
            <p className="text-xs text-zinc-400 mt-1 max-w-md mx-auto">
              Interactive 3D stacked card deck: drag horizontally to inspect form tracking, tempo control, and streak defense.
            </p>
          </div>

          <div
            className="relative w-full max-w-5xl h-80 sm:h-96 lg:h-[420px] flex items-center justify-center cursor-grab active:cursor-grabbing"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onTouchStart={handleMouseDown}
            onTouchMove={handleMouseMove}
            onTouchEnd={handleMouseUp}
          >
            {slidesData.map((slide, i) => {
              let diff = (i - progress) % total;
              if (diff > total / 2) diff -= total;
              if (diff < -total / 2) diff += total;

              const xOffset = diff * 160;
              const yOffset = Math.abs(diff) * 25;
              const rotation = diff * 10;
              const scale = 1 - Math.abs(diff) * 0.12;
              const zIndex = 100 - Math.round(Math.abs(diff) * 10);
              const opacity = 1 - Math.abs(diff) * 0.28;

              return (
                <div
                  key={i}
                  className="absolute w-64 sm:w-72 lg:w-80 h-80 sm:h-96 rounded-2xl overflow-hidden border border-white/[0.12] bg-zinc-950/80 shadow-2xl transition-all duration-300"
                  style={{
                    transform: `translate3d(${xOffset}px, ${yOffset}px, 0px) rotate(${rotation}deg) scale(${scale})`,
                    zIndex,
                    opacity: opacity > 0 ? opacity : 0,
                  }}
                >
                  <img
                    src={slide.image}
                    alt={slide.title}
                    className="w-full h-44 sm:h-52 object-cover"
                  />
                  <div className="p-5 flex flex-col justify-between h-[calc(100%-11rem)] sm:h-[calc(100%-13rem)]">
                    <div>
                      <span className="text-[10px] font-mono tracking-wider px-2 py-0.5 rounded-full bg-white/[0.08] text-zinc-300 border border-white/[0.08] uppercase">
                        {slide.badge}
                      </span>
                      <h4 className="text-base sm:text-lg font-bold text-white mt-2 tracking-tight">
                        {slide.title}
                      </h4>
                      <p className="text-xs text-zinc-400 mt-1 line-clamp-2">
                        {slide.description}
                      </p>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex items-center gap-3 mt-4 text-xs text-zinc-500 font-mono">
            <button
              onClick={() => setProgress((p) => Math.round(p) - 1)}
              className="px-3 py-1 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-white transition-colors"
            >
              ← Prev
            </button>
            <span>Drag or swipe cards</span>
            <button
              onClick={() => setProgress((p) => Math.round(p) + 1)}
              className="px-3 py-1 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-white transition-colors"
            >
              Next →
            </button>
          </div>
        </div>
      );
    }

    /**
     * Reusable 3D Tilt Exercise Card with Streaks Card Animation
     */
    function TiltExerciseCard({ exercise, isSelected, onSelect }) {
      const cardRef = useRef(null);
      const videoRef = useRef(null);
      const [isMuted, setIsMuted] = useState(true);
      const [tilt, setTilt] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        setTilt({
          x: Math.max(-10, Math.min(10, x * 18)),
          y: Math.max(-8, Math.min(8, -y * 14)),
        });
      };

      const handleMouseLeave = () => {
        setTilt({ x: 0, y: 0 });
      };

      const toggleSound = (e) => {
        e.stopPropagation();
        if (!videoRef.current) return;
        const nextMuted = !isMuted;
        videoRef.current.muted = nextMuted;
        setIsMuted(nextMuted);
        if (!nextMuted) videoRef.current.play().catch(() => {});
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          onClick={() => onSelect(exercise.id)}
          style={{
            transform: `perspective(1000px) rotateX(${tilt.y}deg) rotateY(${tilt.x}deg)`,
            transition: "transform 0.15s ease-out",
          }}
          className={`group relative rounded-2xl border p-2 backdrop-blur-xl transition-all cursor-pointer ${
            isSelected
              ? "border-emerald-400 bg-zinc-900/90 shadow-2xl shadow-emerald-500/25 ring-2 ring-emerald-500/40"
              : "border-white/10 bg-zinc-900/60 hover:border-emerald-500/40 hover:shadow-xl hover:shadow-emerald-500/10"
          }`}
        >
          {/* Ambient corner voxel glow accents */}
          <div className="pointer-events-none absolute inset-0 z-0 overflow-hidden rounded-2xl" aria-hidden="true">
            <span className="absolute -top-1 -left-1 size-2 rounded bg-emerald-400/40 group-hover:scale-150 transition-transform" />
            <span className="absolute -bottom-1 -right-1 size-2 rounded bg-cyan-400/40 group-hover:scale-150 transition-transform" />
          </div>

          <div className="relative aspect-video w-full overflow-hidden rounded-xl bg-black">
            <video
              ref={videoRef}
              src={exercise.videoUrl}
              autoPlay
              loop
              muted={isMuted}
              playsInline
              className="size-full object-cover select-none pointer-events-none"
            />
            <div className="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/30" />

            {/* Top Badge */}
            <div className="absolute top-2.5 left-2.5 flex items-center gap-1.5 rounded-full border border-white/20 bg-black/60 px-2.5 py-0.5 text-[10px] font-bold text-white uppercase tracking-wider backdrop-blur-md">
              <span className="size-1.5 rounded-full bg-emerald-400 animate-pulse" />
              <span>{exercise.difficulty}</span>
            </div>

            {/* Form Score Badge */}
            <div className="absolute top-2.5 right-2.5 flex items-center gap-1 rounded-full border border-emerald-500/30 bg-emerald-950/70 px-2 py-0.5 text-[10px] font-mono font-bold text-emerald-300 backdrop-blur-md">
              <span>{exercise.formScore}% CV</span>
            </div>

            {/* Audio Toggle Button */}
            <button
              type="button"
              onClick={toggleSound}
              className="absolute bottom-2.5 right-2.5 flex items-center gap-1.5 rounded-full border border-white/20 bg-black/60 px-2.5 py-1 text-[11px] font-bold text-white backdrop-blur-md hover:bg-black/80 transition-all cursor-pointer"
              title={isMuted ? "Unmute audio" : "Mute audio"}
            >
              {isMuted ? (
                <>
                  <IconVolumeX className="size-3 text-zinc-300" />
                  <span className="text-[10px]">Audio</span>
                </>
              ) : (
                <>
                  <IconVolume2 className="size-3 text-emerald-400 animate-pulse" />
                  <span className="text-[10px] text-emerald-400">Playing</span>
                </>
              )}
            </button>
          </div>

          {/* Info Block */}
          <div className="p-3.5 space-y-2 select-none">
            <div className="flex items-start justify-between gap-2">
              <h4 className="text-sm font-bold text-white tracking-tight group-hover:text-emerald-400 transition-colors leading-snug">
                {exercise.name}
              </h4>
              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/[0.06] text-zinc-300 border border-white/[0.08] whitespace-nowrap">
                {exercise.setsReps}
              </span>
            </div>

            <p className="text-xs text-zinc-400 font-normal line-clamp-1">
              {exercise.category}
            </p>

            <div className="flex flex-wrap gap-1.5 pt-1">
              {exercise.muscles.slice(0, 2).map((m, idx) => (
                <span key={idx} className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                  {m.name.split(" ")[0]} {m.pct}%
                </span>
              ))}
              <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-300 border border-blue-500/20">
                {exercise.tempo.split(" ")[0]}
              </span>
            </div>

            <div className="pt-2 flex items-center justify-between text-[11px] border-t border-white/[0.06]">
              <span className={`font-semibold flex items-center gap-1.5 ${isSelected ? "text-emerald-400" : "text-zinc-400 group-hover:text-white"}`}>
                <span>{isSelected ? "● Loaded in Simulator" : "▶ Simulate Form"}</span>
              </span>
              <span className="text-zinc-500 group-hover:translate-x-1 transition-transform">→</span>
            </div>
          </div>
        </div>
      );

    /**
     * ============================================================================
     * Scroll Morph 3D Orbit & Rainbow Arch Component (components/ui/scroll-morph-hero.tsx)
     * ============================================================================
     */
    function ScrollMorphStage({ exercises, selectedId, onSelect }) {
      const containerRef = useRef(null);
      const [phase, setPhase] = useState("scatter");
      const [virtualScroll, setVirtualScroll] = useState(0);
      const [mouseOffset, setMouseOffset] = useState(0);
      const [flippedIndex, setFlippedIndex] = useState(null);
      const [containerSize, setContainerSize] = useState({ width: 1000, height: 600 });

      useEffect(() => {
        if (!containerRef.current) return;
        const updateSize = () => {
          if (containerRef.current) {
            setContainerSize({
              width: containerRef.current.offsetWidth || 1000,
              height: containerRef.current.offsetHeight || 600,
            });
          }
        };
        updateSize();
        window.addEventListener("resize", updateSize);
        return () => window.removeEventListener("resize", updateSize);
      }, []);

      useEffect(() => {
        const t1 = setTimeout(() => setPhase("line"), 600);
        const t2 = setTimeout(() => setPhase("circle"), 2200);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;

        const handleWheel = (e) => {
          e.preventDefault();
          setVirtualScroll((prev) => Math.min(Math.max(prev + e.deltaY * 0.8, 0), 2800));
        };

        let startY = 0;
        const handleTouchStart = (e) => {
          if (e.touches && e.touches[0]) startY = e.touches[0].clientY;
        };
        const handleTouchMove = (e) => {
          if (e.touches && e.touches[0]) {
            const dy = startY - e.touches[0].clientY;
            startY = e.touches[0].clientY;
            setVirtualScroll((prev) => Math.min(Math.max(prev + dy * 1.5, 0), 2800));
          }
        };

        el.addEventListener("wheel", handleWheel, { passive: false });
        el.addEventListener("touchstart", handleTouchStart, { passive: true });
        el.addEventListener("touchmove", handleTouchMove, { passive: true });

        return () => {
          el.removeEventListener("wheel", handleWheel);
          el.removeEventListener("touchstart", handleTouchStart);
          el.removeEventListener("touchmove", handleTouchMove);
        };
      }, []);

      const handleMouseMove = (e) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const norm = (e.clientX - rect.left) / rect.width - 0.5;
        setMouseOffset(norm * 80);
      };

      const morphProgress = Math.min(Math.max(virtualScroll / 600, 0), 1);
      const scrollRotation = virtualScroll > 600 ? ((virtualScroll - 600) / 2200) * 120 : 0;
      const total = exercises.length;

      return (
        <div
          ref={containerRef}
          onMouseMove={handleMouseMove}
          className="relative w-full h-[580px] sm:h-[640px] rounded-3xl border border-white/10 bg-black/95 overflow-hidden shadow-2xl mb-12 select-none"

          <div className="relative w-full h-full flex items-center justify-center overflow-hidden" style={{ perspective: "1000px" }}>

              let x = 0, y = 0, rot = 0, scale = 1, opacity = 1;

              const isMobile = containerSize.width < 768;
              const minDim = Math.min(containerSize.width, containerSize.height);

              if (phase === "scatter") {
                const angle = (idx / total) * Math.PI * 2;
                x = Math.cos(angle) * 350 + (Math.sin(idx * 7) * 80);
                y = Math.sin(angle) * 220 + (Math.cos(idx * 5) * 60);
                rot = (idx * 37) % 180 - 90;
                scale = 0.5;
                opacity = 0.3;
              } else if (phase === "line") {
                const spacing = 52;
                x = (idx - total / 2) * spacing;
                y = 0;
                rot = 0;
                scale = 0.85;
                opacity = 0.9;
              } else {
                const circleRadius = Math.min(minDim * 0.35, 260);
                const circleAngle = (idx / total) * 360;
                const circleRad = (circleAngle * Math.PI) / 180;
                const circleX = Math.cos(circleRad) * circleRadius;
                const circleY = Math.sin(circleRad) * circleRadius + 20;
                const circleRot = circleAngle + 90;

                const arcRadius = Math.min(containerSize.width * 0.85, containerSize.height * 1.2);
                const arcCenterY = containerSize.height * 0.28 + arcRadius;
                const spreadAngle = isMobile ? 100 : 135;
                const startAngle = -90 - spreadAngle / 2;
                const step = spreadAngle / Math.max(1, total - 1);

                const currentArcAngle = startAngle + idx * step - scrollRotation;
                const arcRad = (currentArcAngle * Math.PI) / 180;
                const arcX = Math.cos(arcRad) * arcRadius + mouseOffset;
                const arcY = Math.sin(arcRad) * arcRadius + arcCenterY;
                const arcRot = currentArcAngle + 90;

                const t = morphProgress;
                x = circleX * (1 - t) + arcX * t;
                y = circleY * (1 - t) + arcY * t;
                rot = circleRot * (1 - t) + arcRot * t;
                scale = 0.85 * (1 - t) + (isMobile ? 1.15 : 1.35) * t;
                opacity = 1;
              }

              const isSelected = selectedId === ex.id;
              const isHovered = flippedIndex === idx;

              return (
                <div
                  key={ex.id}
                  onClick={() => {
                    onSelect(ex.id);
                    const el = document.getElementById("featured-player");

                  style={{
                    position: "absolute",
                    width: "72px",
                    height: "100px",
                    transform: `translate3d(${x}px, ${y}px, 0px) rotate(${rot}deg) scale(${scale})`,
                    transition: "transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease",
                    zIndex: isHovered ? 50 : isSelected ? 40 : 10 + Math.round(scale * 10),
                    perspective: "1000px",
                  }}
                  className="cursor-pointer group"
                >
                  <div
                    style={{
                      transformStyle: "preserve-3d",
                      transform: isHovered ? "rotateY(180deg) scale(1.1)" : "rotateY(0deg)",
                      transition: "transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
                    }}
                    className="relative w-full h-full"
                  >
                    {/* Front Face: Video Loop */}

                      style={{ backfaceVisibility: "hidden" }}
                      className={`absolute inset-0 w-full h-full rounded-xl overflow-hidden border shadow-2xl transition-all ${
                        isSelected

                          : "border-white/20 group-hover:border-emerald-400/60"
                      } bg-zinc-950`}
                    >
                      <video

                        autoPlay
                        loop
                        muted
                        playsInline
                        className="w-full h-full object-cover select-none pointer-events-none"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/30 pointer-events-none" />

                      <div className="absolute bottom-1 left-1 right-1 pointer-events-none">

                        </span>
                      </div>

                      {isSelected && (

    /**
     * ============================================================================
     * 7c. Calendar & Range Select Icons & Components
     * ============================================================================
     */
    
    function Calendar({
      mode = "range",
      defaultMonth = new Date(2026, 5, 4),
      selected,
      onSelect,
      className = "",
      classNames = {},
    }) {
      const [viewDate, setViewDate] = useState(() => {
        if (defaultMonth instanceof Date) return new Date(defaultMonth);
        if (selected?.from instanceof Date) return new Date(selected.from);
        return new Date(2026, 5, 1);
      });

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      const prevMonth = () => {
        setViewDate(new Date(year, month - 1, 1));
      };

      const nextMonth = () => {
        setViewDate(new Date(year, month + 1, 1));
      };

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthTotalDays = new Date(year, month, 0).getDate();

      const days = [];

      for (let i = firstDayIndex - 1; i >= 0; i--) {
        days.push({
          date: new Date(year, month - 1, prevMonthTotalDays - i),
          isCurrentMonth: false,
          dayNum: prevMonthTotalDays - i,
        });
      }

      for (let i = 1; i <= totalDays; i++) {
        days.push({
          date: new Date(year, month, i),
          isCurrentMonth: true,
          dayNum: i,
        });
      }

      const remainder = (7 - (days.length % 7)) % 7;
      for (let i = 1; i <= remainder; i++) {
        days.push({
          date: new Date(year, month + 1, i),
          isCurrentMonth: false,
          dayNum: i,
        });
      }

      const isSameDay = (d1, d2) => {
        if (!d1 || !d2) return false;
        return (
          d1.getFullYear() === d2.getFullYear() &&
          d1.getMonth() === d2.getMonth() &&
          d1.getDate() === d2.getDate()
        );
      };

      const isBetween = (d, start, end) => {
        if (!d || !start || !end) return false;
        const s = new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
        const e = new Date(end.getFullYear(), end.getMonth(), end.getDate()).getTime();
        const cur = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        return cur > s && cur < e;
      };

      const handleDateClick = (clickedDate) => {
        if (!onSelect) return;
        if (!selected?.from || (selected.from && selected.to)) {
          onSelect({ from: clickedDate, to: undefined });
        } else if (selected.from && !selected.to) {
          if (clickedDate.getTime() < selected.from.getTime()) {
            onSelect({ from: clickedDate, to: undefined });
          } else {
            onSelect({ from: selected.from, to: clickedDate });
          }
        }
      };

      return (
        <div className={`p-4 sm:p-5 rounded-2xl bg-zinc-950/80 border border-white/[0.08] backdrop-blur-xl ${className}`}>
          {/* Calendar Header */}
          <div className="flex items-center justify-between pb-3.5 mb-2 border-b border-white/[0.06]">
            <h4 className="text-sm font-semibold tracking-tight text-white flex items-center gap-2">
              <span className="size-2 rounded-full bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)]" />
              <span>{monthNames[month]}</span>
              <span className="font-mono text-xs text-zinc-400 font-normal">{year}</span>
            </h4>
            <div className="flex items-center gap-1.5">
              <button
                type="button"
                onClick={prevMonth}
                className="p-1.5 rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:bg-white/[0.06] transition-colors cursor-pointer"
                title="Previous Month"
              >
                <IconChevronLeft className="size-3.5" />
              </button>
              <button
                type="button"
                onClick={nextMonth}
                className="p-1.5 rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:bg-white/[0.06] transition-colors cursor-pointer"
                title="Next Month"
              >
                <IconChevronRight className="size-3.5" />
              </button>
            </div>
          </div>

          {/* Weekday Labels */}
          <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-mono font-medium text-zinc-500 mb-1.5">
            {["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((day, idx) => (
              <div key={idx} className="h-7 flex items-center justify-center">
                {day}
              </div>
            ))}
          </div>

          {/* Days Grid */}
          <div className="grid grid-cols-7 gap-y-1">
            {days.map((item, idx) => {
              const isStart = isSameDay(item.date, selected?.from);
              const isEnd = isSameDay(item.date, selected?.to);
              const inRange = isBetween(item.date, selected?.from, selected?.to);

              let cellStyle = "";
              let btnStyle = "text-zinc-300 hover:bg-white/10 hover:text-white";

              if (isStart && isEnd) {
                cellStyle = "bg-blue-500/20 rounded-full";

    function SmoothButton({
      className = "",
      variant = "default",
      size = "default",
      type = "button",
      disabled = false,
      loading = false,
      onClick,
      children,
      prefix,
      shape,
      ...props
    }) {
      let baseStyle = "inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-lg font-medium text-sm transition-transform duration-150 ease-out focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 active:scale-[0.97] disabled:pointer-events-none disabled:opacity-50 ";
      if (shape === "pill") baseStyle += " rounded-full ";

      let variantStyle = "";
      if (variant === "default") {
        variantStyle = "bg-white text-black hover:bg-zinc-200 shadow-sm";
      } else if (variant === "outline") {
        variantStyle = "border border-white/10 bg-white/[0.03] hover:bg-white/[0.08] text-white shadow-sm";
      } else if (variant === "ghost") {
        variantStyle = "hover:bg-white/[0.06] text-zinc-300 hover:text-white";
      } else if (variant === "link") {
        variantStyle = "text-primary text-zinc-300 hover:text-white underline-offset-4 hover:underline p-0 h-auto";
      } else if (variant === "candy") {
        variantStyle = "border border-white/25 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-white font-semibold shadow-lg shadow-emerald-500/20 hover:brightness-110";
      }

      let sizeStyle = "h-10 px-4 py-2";
      if (size === "sm") sizeStyle = "h-8 px-3 text-xs";
      if (size === "lg") sizeStyle = "h-11 px-6 text-sm";
      if (size === "icon") sizeStyle = "h-8 w-8 p-0 flex items-center justify-center";

      return (
        <button
          type={type}
          disabled={disabled || loading}
          onClick={onClick}
          className={`${baseStyle} ${variantStyle} ${sizeStyle} ${className}`}
          {...props}
        >
          {prefix && <span className="flex shrink-0 items-center">{prefix}</span>}
          {children}
        </button>
      );
    }

    function AuthForm({ mode: initialMode = "sign-in", onModeChange, onSubmit, status = "idle", className = "" }) {
      const [mode, setMode] = useState(initialMode);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [formStatus, setFormStatus] = useState(status);
      const [error, setError] = useState("");

      const isSignUp = mode === "sign-up";
      const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

      const requirements = [
        { id: "length", label: "At least 8 characters", met: password.length >= 8 },
        { id: "uppercase", label: "One uppercase letter", met: /[A-Z]/.test(password) },
        { id: "number", label: "One number", met: /[0-9]/.test(password) },
      ];

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!isEmailValid) {
          setError("Please enter a valid email address.");
          return;
        }
        if (isSignUp && !requirements.every(r => r.met)) {
          setError("Please satisfy all password requirements.");
          return;
        }
        setError("");
        setFormStatus("submitting");
        setTimeout(() => {
          setFormStatus("success");
          if (onSubmit) onSubmit({ email, password, mode });
        }, 1100);
      };

      const handleGoogleAuth = () => {
        setFormStatus("submitting");
        setTimeout(() => {
          setFormStatus("success");
          if (onSubmit) onSubmit({ email: "lifter.apex@google.com", password: "", mode: "sign-in" });
        }, 900);
      };

      return (
        <div className={`w-full max-w-sm mx-auto text-left ${className}`}>
          {/* Header */}
          <div className="mb-6">
            <h2 className="font-bold text-white text-2xl tracking-tight">
              {isSignUp ? "Create your account" : "Welcome back"}
            </h2>
            <p className="mt-1 text-zinc-400 text-sm">
              {isSignUp
                ? "Start with your email — we'll take it from there."
                : "Sign in to continue your biomechanical telemetry."}
            </p>
          </div>

          {/* Social Providers */}
          <div className="grid gap-2 mb-4">
            <SmoothButton
              variant="outline"
              size="lg"
              className="w-full text-xs font-semibold justify-center bg-white/[0.04] hover:bg-white/[0.08] border-white/10"
              onClick={handleGoogleAuth}
              prefix={<IconGlobe className="size-4 mr-2 text-emerald-400" />}
            >
              Continue with Google
            </SmoothButton>
            <SmoothButton
              variant="outline"
              size="lg"
              className="w-full text-xs font-semibold justify-center bg-white/[0.04] hover:bg-white/[0.08] border-white/10"
              onClick={() => { setEmail("lifter@fitquest.io"); }}
              prefix={<IconMail className="size-4 mr-2 text-cyan-400" />}
            >
              Continue with Email Link
            </SmoothButton>
          </div>

          <div className="relative my-4 text-center text-xs">
            <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 border-t border-white/[0.08]" />
            <span className="relative z-10 bg-zinc-950 px-3 text-zinc-500 font-mono text-[11px] uppercase tracking-wider">
              or continue with credentials
            </span>
          </div>

          {/* Error Banner */}
          {error && (
            <div className="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-2.5 text-red-400 text-xs">
              {error}
            </div>
          )}

          {/* Form */}
          <form onSubmit={handleFormSubmit} className="space-y-4">
            <div className="space-y-1.5">
              <label className="text-xs font-medium text-zinc-300">Email Address</label>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="athlete@fitquest.io"
                disabled={formStatus === "submitting" || formStatus === "success"}
                className="w-full h-11 rounded-lg border border-white/10 bg-white/[0.03] px-3.5 text-sm text-white placeholder-zinc-500 outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
              />
            </div>

            {/* Password input */}
            <div className={`space-y-1.5 transition-all duration-300 ${isEmailValid ? 'opacity-100 max-h-96' : 'opacity-70'}`}>
              <label className="text-xs font-medium text-zinc-300">Password</label>
              <div className="relative">
                <input
                  type={showPassword ? "text" : "password"}
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••••••"
                  disabled={formStatus === "submitting" || formStatus === "success"}
                  className="w-full h-11 rounded-lg border border-white/10 bg-white/[0.03] px-3.5 pr-11 text-sm text-white placeholder-zinc-500 outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
                />
                <button
                  type="button"
                  onClick={() => setShowPassword(!showPassword)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white"
                >
                  {showPassword ? <IconEyeOff className="size-4" /> : <IconEye className="size-4" />}
                </button>
              </div>

              {/* Password Requirements live ticking (for Sign-up) */}
              {isSignUp && (
                <ul className="mt-2 space-y-1 text-xs">
                  {requirements.map((req) => (
                    <li key={req.id} className="flex items-center gap-2">
                      <span className={`size-3.5 rounded-full flex items-center justify-center text-[9px] ${req.met ? 'bg-emerald-500 text-black font-bold' : 'border border-zinc-600 text-transparent'}`}>
                        ✓
                      </span>
                      <span className={req.met ? 'text-zinc-200' : 'text-zinc-500'}>
                        {req.label}
                      </span>
                    </li>
                  ))}
                </ul>
              )}
            </div>

            {/* Submit Button */}
            <SmoothButton
              type="submit"
              variant="candy"
              size="lg"
              disabled={formStatus === "submitting" || formStatus === "success"}
              className="w-full h-11 text-sm font-semibold mt-2"
            >
              {formStatus === "submitting" ? (
                <span className="flex items-center gap-2">
                  <span className="size-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin" />
                  Authenticating...
                </span>
              ) : formStatus === "success" ? (
                <span className="flex items-center gap-2 text-emerald-100">
                  <IconCheck className="size-4" />
                  Authenticated Successfully
                </span>
              ) : (
                isSignUp ? "Create Account" : "Sign In to FitQuest"
              )}
            </SmoothButton>
          </form>

          {/* Toggle between Sign In / Sign Up */}
          <p className="mt-5 text-center text-xs text-zinc-400">
            {isSignUp ? "Already have an account?" : "Don't have an account?"}{" "}
            <button
              type="button"
              onClick={() => {
                const next = isSignUp ? "sign-in" : "sign-up";
                setMode(next);
                if (onModeChange) onModeChange(next);
              }}
              className="font-semibold text-cyan-400 hover:text-cyan-300 underline underline-offset-4"
            >
              {isSignUp ? "Sign In" : "Sign Up"}
            </button>
          </p>
        </div>
      );
    }

                  <div className="text-base font-bold text-white font-mono">{carbGrams}g</div>
                </div>
                <div className="p-2 rounded-lg bg-zinc-900/60 border border-white/5">
                  <div className="text-[10px] font-mono text-zinc-500 uppercase">Fats</div>
                  <div className="text-base font-bold text-white font-mono">{fatGrams}g</div>
                </div>
              </div>
            </div>

            {/* Card 4: BMI Range Analysis */}
            <div className="p-5 rounded-2xl border border-white/[0.08] bg-white/[0.02] relative overflow-hidden">
              <div className="flex items-center justify-between text-xs text-zinc-400 mb-2">
                <span className="font-mono uppercase text-[10px] text-zinc-500">Body Mass Index</span>
                <span className="text-emerald-400 font-mono text-[10px]">OPTIMAL ATHLETIC</span>
              </div>
              <div className="text-2xl font-black text-white flex items-baseline gap-2">
                <span>{currentBmi}</span>
                <span className="text-zinc-500 text-sm font-normal">→</span>
                <span className="text-emerald-400 font-mono">{targetBmi} BMI</span>
              </div>
              <div className="mt-2 text-xs text-zinc-400 flex items-center justify-between">
                <span>Optimal Band: <strong className="text-zinc-300 font-mono">21.5 - 24.5</strong></span>
                <span className="text-zinc-500 font-mono text-[10px]">Height: {heightCm}cm</span>
              </div>
            </div>

          </div>

          {/* 4. Multi-Phase Weight Roadmap Stepper */}
          <div className="p-6 sm:p-8 rounded-2xl border border-white/[0.08] bg-zinc-950/60 space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <span className="text-[11px] font-mono tracking-widest text-emerald-400 uppercase block mb-1">
                  PERIODIZED OVERLOAD TIMELINE // {timelineWeeks} WEEKS TO TARGET
                </span>
                <h3 className="text-xl font-bold text-white tracking-tight">
                  3-Phase Hypertrophy & Body Transformation Trajectory
                </h3>
              </div>
              <div className="flex items-center gap-1.5 p-1 rounded-xl bg-zinc-900/80 border border-white/5">
                {roadmapPhases.map((phase, idx) => (
                  <button
                    key={phase.id}
                    type="button"
                    onClick={() => setActivePhaseTab(idx)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${activePhaseTab === idx ? 'bg-white/[0.08] text-white shadow-sm' : 'text-zinc-400 hover:text-white'}`}
                  >
                    {phase.weeksSpan}
                  </button>
                ))}
              </div>
            </div>

            {/* Stepper Cards */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {roadmapPhases.map((phase, idx) => (
                <div
                  key={phase.id}
                  onClick={() => setActivePhaseTab(idx)}
                  className={`p-5 rounded-xl border transition-all cursor-pointer relative ${activePhaseTab === idx ? `${phase.color} shadow-lg ring-1 ring-white/10` : 'border-white/[0.06] bg-white/[0.01] hover:border-white/15'}`}
                >
                  <div className="flex items-center justify-between text-xs font-mono mb-2">
                    <span className="font-bold tracking-wider">{phase.iconBadge}</span>
                    <span className="text-zinc-400">{phase.duration}</span>
                  </div>
                  <h4 className="text-sm font-bold text-white mb-2">{phase.name}</h4>
                  <div className="text-xs font-mono text-zinc-300 font-semibold mb-2">
                    Target: {phase.weightTarget}
                  </div>
                  <p className="text-xs text-zinc-400 leading-relaxed mb-3">
                    {phase.focus}
                  </p>
                  <div className="pt-2 border-t border-white/5 text-[11px] font-mono text-zinc-500">
                    Strategy: {phase.calorieStrategy}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* 5. Weekly Workout Split Schedule (Day-by-Day Interactive Deck) */}
          <div className="space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span className="text-[11px] font-mono tracking-widest text-cyan-400 uppercase block mb-1">
                  PRESCRIPTIVE WORKOUT MATRIX // {daysPerWeek}-DAY SPLIT
                </span>
                <h3 className="text-2xl font-bold text-white tracking-tight">
                  Weekly Training Cadence & Biomechanical Execution
                </h3>
              </div>

              {/* Day Selector Pills */}
              <div className="flex flex-wrap items-center gap-2">
                {currentSchedule.map((day, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => setActiveSplitDay(idx)}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold border transition-all cursor-pointer ${activeSplitDay === idx ? 'border-cyan-400 bg-cyan-400/15 text-cyan-300 shadow-md shadow-cyan-500/10' : 'border-white/10 bg-white/[0.02] text-zinc-400 hover:text-white hover:bg-white/[0.06]'}`}
                  >
                    Day {idx + 1}
                  </button>
                ))}
              </div>
            </div>

            {/* Selected Day Workout Card */}
            <div className="p-6 sm:p-8 rounded-2xl border border-white/[0.08] bg-zinc-950/70 space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-white/[0.08]">
                <div>
                  <h4 className="text-xl font-extrabold text-white">
                    {selectedDayPlan.dayTitle}
                  </h4>
                  <p className="text-xs text-zinc-400 mt-0.5">
                    Targeted Muscle Groups: <strong className="text-zinc-200">{selectedDayPlan.focus}</strong>
                  </p>
                </div>
                <div className="flex items-center gap-3 text-xs font-mono text-zinc-400">
                  <span className="px-3 py-1 rounded-full bg-white/[0.04] border border-white/5">
                    ⏱️ {selectedDayPlan.estimatedDuration}
                  </span>
                  <span className="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                    {selectedDayPlan.exercises.length} Exercises Prescribed
                  </span>
                </div>
              </div>

              {/* Exercise Items List */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {selectedDayPlan.exercises.map((item, exIdx) => {
                  const exData = EXERCISES_DATA[item.exId] || {};
                  return (
                    <div
                      key={exIdx}
                      className="p-5 rounded-xl border border-white/[0.08] bg-white/[0.02] hover:bg-white/[0.04] hover:border-cyan-500/30 transition-all flex flex-col justify-between space-y-4 group"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2 mb-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" />
                            <span className="text-[10px] font-mono uppercase tracking-wider text-zinc-400">
                              {exData.muscleGroupLabel || exData.muscleGroup || "Compound"}
                            </span>
                          </div>
                          <h5 className="font-bold text-white text-base group-hover:text-cyan-300 transition-colors">
                            {exData.name || item.exId}
                          </h5>
                          <p className="text-xs text-zinc-400 mt-1">
                            {exData.category || "Hypertrophy Movement"}
                          </p>
                        </div>

                        {/* Simulate Lift Button */}
                        <button
                          type="button"
                          onClick={() => {
                            if (onSimulateExercise) onSimulateExercise(item.exId);
                          }}
                          className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 transition-all flex items-center gap-1.5 cursor-pointer shrink-0 shadow-sm"
                          title="Open in 3D Exercise Simulator"
                        >
                          <span>▶ 3D Simulate</span>
                        </button>
                      </div>

                      {/* Telemetry Stats: Sets, Reps, Tempo, Rest */}
                      <div className="grid grid-cols-4 gap-2 pt-3 border-t border-white/5 text-center text-xs">
                        <div className="p-1.5 rounded bg-zinc-900/60 border border-white/5">
                          <span className="text-[9px] font-mono text-zinc-500 uppercase block">Sets</span>
                          <span className="font-bold text-white font-mono text-[11px]">{item.sets}</span>
                        </div>
                        <div className="p-1.5 rounded bg-zinc-900/60 border border-white/5">
                          <span className="text-[9px] font-mono text-zinc-500 uppercase block">Reps</span>
                          <span className="font-bold text-white font-mono text-[11px]">{item.reps}</span>
                        </div>
                        <div className="p-1.5 rounded bg-zinc-900/60 border border-white/5">
                          <span className="text-[9px] font-mono text-zinc-500 uppercase block">Tempo</span>
                          <span className="font-bold text-cyan-400 font-mono text-[11px]">{item.tempo}</span>
                        </div>
                        <div className="p-1.5 rounded bg-zinc-900/60 border border-white/5">
                          <span className="text-[9px] font-mono text-zinc-500 uppercase block">Rest</span>
                          <span className="font-bold text-amber-400 font-mono text-[11px]">{item.rest}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* ── 6. TODAY'S WORKOUT LAUNCHER BANNER ── */}
          <div className="mt-12 p-8 rounded-3xl border border-cyan-500/30 bg-gradient-to-r from-cyan-950/40 via-zinc-950 to-emerald-950/30 shadow-[0_0_50px_rgba(0,245,212,0.12)] flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden group">
            {/* Ambient Background glow */}
            <div className="absolute -right-20 -bottom-20 w-80 h-80 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none group-hover:bg-cyan-500/15 transition-all" />

            <div className="space-y-2 text-left relative z-10">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" />
                <span className="text-xs font-mono font-bold text-cyan-400 uppercase tracking-widest">
                  SESSION READY // {selectedDayPlan.exercises.length} EXERCISES LOADED
                </span>
              </div>
              <h3 className="text-2xl sm:text-3xl font-black text-white uppercase tracking-tight">
                Today's Workout
              </h3>
              <p className="text-sm text-zinc-300 max-w-xl">
                Ready to train? Launch today's prescribed split (<strong className="text-white">{selectedDayPlan.dayTitle}</strong>) with integrated 3D anatomical video simulation, 120 FPS joint angle tracking, and live set execution.
              </p>
            </div>

            <div className="relative z-10 shrink-0">
              <LiquidButton
                onClick={() => {
                  setViewMode("todays-workout");
                  window.scrollTo({ top: 300, behavior: "smooth" });
                }}
                className="px-8 py-3.5 h-13 text-sm text-white font-semibold hover:text-white transition-all shadow-xl whitespace-nowrap"
              >
                <span>Launch Today's Workout ⚡</span>
              </LiquidButton>
            </div>
          </div>

        </div>
      );
    }

    function FitQuestApp() {
      const [showAuthModal, setShowAuthModal] = useState(() => typeof window !== "undefined" && window.location.hash.toLowerCase().includes("auth"));
      const [currentUser, setCurrentUser] = useState(null);

      const getInitialView = () => {
        if (typeof window !== "undefined" && window.location.hash && window.location.hash !== "#home" && window.location.hash !== "") {
          return "dashboard";
        }
        return "landing";
      };

      const getInitialTab = () => {
        if (typeof window !== "undefined" && window.location.hash) {
          const h = window.location.hash.toLowerCase();
          if (h.includes("today") || h.includes("split")) return "Splits";
          if (h.includes("streak")) return "Streaks Card";
          if (h.includes("simulator")) return "Simulator";
          if (h.includes("split")) return "Splits";
        }
        return "Leaderboard";
      };

      const [view, setView] = useState(getInitialView);
      const [activeTab, setActiveTab] = useState(getInitialTab);

      // Tabs: Leaderboard (cards + leaderboard only), Streaks Card (Voxel streak card), Simulator, Splits
      const navLinks = ["Leaderboard", "Streaks Card", "Simulator", "Splits"];

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.toLowerCase();
          if (hash === "#auth") { setView("dashboard"); setShowAuthModal(true); } else if (hash === "" || hash === "#home") {
            setView("landing");
          } else {
            setView("dashboard");
            if (hash.includes("today")) { setActiveTab("Splits"); setView("dashboard"); } else if (hash.includes("streak")) setActiveTab("Streaks Card");
            else if (hash.includes("simulator")) setActiveTab("Simulator");
            else if (hash.includes("split")) setActiveTab("Splits");
            else setActiveTab("Leaderboard");
          }
        };

        window.addEventListener("hashchange", handleHashChange);
        return () => window.removeEventListener("hashchange", handleHashChange);
      }, []);

      const handleNavSelect = (link) => {
        setActiveTab(link);
        setView("dashboard");
        const hashKey = link.toLowerCase().replace(/\s+/g, "-");
        window.location.hash = `#${hashKey}`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleGetStarted = () => {
        window.location.hash = "#leaderboard";
        setView("dashboard");
        setActiveTab("Leaderboard");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div className="relative min-h-screen bg-black text-white flex flex-col justify-between selection:bg-zinc-800 selection:text-white">
          
          {/* ── 1. MINIMAL LANDING HERO ── */}
          {view === "landing" && (
            <div className="relative w-screen h-screen overflow-hidden">
              <FlashlightTextReveal
                text={"FITQUEST\nTRANSCEND\nYOUR\nLIMITS"}
                fontFamily={'-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif'}
                fontWeight="900"
                fontSize="clamp(3.5rem, 12vw, 10rem)"
                colors={["#08080C", "#252836", "#00F5D4"]}
                height="100vh"
                radius={0.36}
                strength={1.2}
                ghost={0.035}
                wander={true}
              >
                {/* Clean Minimal Get Started Liquid Button */}
                <div className="absolute inset-x-0 bottom-16 z-30 flex justify-center pointer-events-auto">
                  <LiquidButton
                    onClick={handleGetStarted}
                    className="px-9 py-4 h-13 text-sm text-white font-medium hover:text-white transition-all shadow-2xl"
                  >
                    <span>Get Started</span>
                    <span className="text-zinc-400 ml-1.5">→</span>
                  </LiquidButton>
                </div>
              </FlashlightTextReveal>
            </div>
          )}

          {view === "dashboard" && (
            <div className="relative min-h-screen bg-black text-white flex flex-col justify-between">
              
              {/* Sticky Top Header with RandomLetterSwapNav */}
              <header className="sticky top-0 z-50 w-full backdrop-blur-xl bg-black/80 border-b border-white/[0.08]">
                <div className="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
                  
                  {/* Brand */}
                  <button
                    onClick={() => { setView("landing"); window.location.hash = ""; }}
                    className="flex items-center gap-2.5 bg-transparent border-0 cursor-pointer outline-none group"
                  >
                    <div className="w-2.5 h-2.5 rounded-full bg-white group-hover:scale-125 transition-transform" />
                    <span className="font-bold text-sm tracking-tight text-white uppercase">
                      FITQUEST
                    </span>
                  </button>

                  {/* Random Letter Swap Navigation Tabs */}
                  <RandomLetterSwapNav
                    links={navLinks}
                    activeLink={activeTab}
                    onSelect={handleNavSelect}
                    className="py-0"
                  />

                  {/* Right Header Actions: Back to Hero + Sign In Liquid Button */}
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => { setView("landing"); }}
                      className="px-4 py-1.5 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.1] text-xs font-medium text-zinc-300 transition-colors cursor-pointer"
                    >
                      ← Back to Hero
                    </button>

                    <LiquidButton
                      onClick={() => setShowAuthModal(true)}
                      className="px-5 py-2 h-9 text-xs text-white font-medium hover:text-white transition-all shadow-md"
                    >
                      <span>{currentUser ? (currentUser.email ? currentUser.email.split('@')[0] : "Account") : "Sign In"}</span>
                    </LiquidButton>
                  </div>

                </div>
              </header>

              

              {/* Main Dashboard Content - Tab-Like Interface */}
              <main className="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8">
                
                {/* ── TAB 1: LEADERBOARD (Includes 3D Cards & Leaderboard ONLY) ── */}
                {activeTab === "Leaderboard" && (
                  <div className="space-y-16">
                    {/* 1. 3D Stacked Carousel Cards */}
                    <div id="cards">
                      <CarouselStacked />
                    </div>

                    {/* 2. Leaderboard Section */}
                    <div id="leaderboard">
                      <LeaderboardSection />
                    </div>
                  </div>
                )}

                {/* ── TAB 2: STREAKS CARD (Gym Context & Active Streaks Calendar) ── */}
                {activeTab === "Streaks Card" && (
                  <div className="w-full space-y-16">
                    <VoxelVideoStreakCard videoSrc="videos/fitquest-video.mp4" posterSrc="videos/fitquest-poster.jpg" videoBadgeText="FitQuest Beast Mode • Active Streak" />
                    <ActiveStreakCalendarSection />
                  </div>
                )}

                {/* ── TAB 3: SIMULATOR (Muscle Group Biomechanical Simulator) ── */}
                {activeTab === "Simulator" && (
                  <div className="w-full">
                    <ExerciseSimulator />
                  </div>
                )}

                {/* ── TAB 4: PERSONALIZED SPLITS & WEIGHT ROADMAP ── */}
                {activeTab === "Splits" && (
                  <PersonalizedSplitsSection
                    onSimulateExercise={(exId) => {
                      setActiveTab("Simulator");
                      window.location.hash = "#simulator";
                      window.scrollTo({ top: 0, behavior: "smooth" });
                    }}
                  />
                )}

              </main>

              {/* Footer */}
              <footer className="w-full border-t border-white/[0.08] py-8 text-center text-xs text-zinc-500 font-mono">
                FITQUEST BIOMECHANICAL SYSTEMS • POWERED BY APPLE SAN FRANCISCO • ALL RIGHTS RESERVED
              </footer>

            </div>
          )}

        {/* Interactive Auth Modal */}
              <AuthModal 
                isOpen={showAuthModal} 
                onClose={() => setShowAuthModal(false)} 
                onAuthenticated={(user) => {
                  setCurrentUser(user);
                }} 
              />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FitQuestApp />);
  </script>
</body>
</html>
