<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitQuest — The Gamified Fitness Odyssey</title>
  <meta name="description" content="FitQuest: Gamified Biomechanical Fitness Progress Tracking with 17-Point Pose Vision, Streak Engine, Trainer Uplink, and Redis Leaderboard.">

  <!-- Inter & Plus Jakarta Sans & Anton Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Anton&family=Syne:wght@800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"SF Pro"', 'system-ui', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro"', 'system-ui', 'sans-serif'],
            mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace']
          },
          colors: {
            black: '#000000',
            surface: '#09090b',
            border: 'rgba(255, 255, 255, 0.08)',
          }
        }
      }
    };
  </script>

  <!-- React 18, Babel Standalone & GSAP with ScrollTrigger -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Keyframe Animations & Tokens -->
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", -apple-system-headline, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, sans-serif;
      letter-spacing: -0.01em;
    }

    @keyframes text-scanner-sweep {
      0% { background-position: 100% 0; }
      100% { background-position: 0% 0; }
    }

    @keyframes text-scanner-laser {
      0% { left: 0%; transform: translateX(0%); }
      100% { left: 100%; transform: translateX(-100%); }
    }

    .animate-scanner-text {
      animation: text-scanner-sweep var(--scanner-duration, 2.6s) ease-in-out infinite alternate;
    }

    .animate-scanner-laser {
      animation: text-scanner-laser var(--scanner-duration, 2.6s) ease-in-out infinite alternate;
    }

    /* Motion Footer Styles */
    .cinematic-footer-wrapper {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      
      --pill-bg-1: rgba(255, 255, 255, 0.04);
      --pill-bg-2: rgba(255, 255, 255, 0.01);
      --pill-shadow: rgba(0, 0, 0, 0.8);
      --pill-highlight: rgba(255, 255, 255, 0.12);
      --pill-inset-shadow: rgba(0, 0, 0, 0.9);
      --pill-border: rgba(255, 255, 255, 0.08);
      
      --pill-bg-1-hover: rgba(255, 255, 255, 0.08);
      --pill-bg-2-hover: rgba(255, 255, 255, 0.03);
      --pill-border-hover: rgba(255, 255, 255, 0.22);
      --pill-shadow-hover: rgba(0, 0, 0, 0.9);
      --pill-highlight-hover: rgba(255, 255, 255, 0.25);
    }

    @keyframes footer-breathe {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
    }

    @keyframes footer-scroll-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes footer-heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 45% { transform: scale(1.2); }
      30% { transform: scale(1); }
    }

    .animate-footer-breathe {
      animation: footer-breathe 8s ease-in-out infinite alternate;
    }

    .animate-footer-scroll-marquee {
      animation: footer-scroll-marquee 35s linear infinite;
    }

    .animate-footer-heartbeat {
      animation: footer-heartbeat 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    .footer-bg-grid {
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    }

    .footer-aurora {
      background: radial-gradient(
        circle at 50% 50%, 
        rgba(59, 130, 246, 0.12) 0%, 
        rgba(139, 92, 246, 0.08) 40%, 
        transparent 70%
      );
    }

    .footer-glass-pill {
      background: linear-gradient(145deg, var(--pill-bg-1) 0%, var(--pill-bg-2) 100%);
      box-shadow: 
          0 10px 30px -10px var(--pill-shadow), 
          inset 0 1px 1px var(--pill-highlight), 
          inset 0 -1px 2px var(--pill-inset-shadow);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .footer-glass-pill:hover {
      background: linear-gradient(145deg, var(--pill-bg-1-hover) 0%, var(--pill-bg-2-hover) 100%);
      border-color: var(--pill-border-hover);
      box-shadow: 
          0 20px 40px -10px var(--pill-shadow-hover), 
          inset 0 1px 1px var(--pill-highlight-hover);
      color: #ffffff;
    }

    .footer-giant-bg-text {
      font-size: 24vw;
      line-height: 0.75;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.05);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .footer-text-glow {
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Minimal Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased selection:bg-zinc-800 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    if (window.gsap && window.ScrollTrigger) {
      gsap.registerPlugin(ScrollTrigger);
    }

    /**
     * ============================================================================
     * 1. Badge Component
     * ============================================================================
     */
    function Badge({ children, className = "" }) {
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold tracking-wide uppercase transition-colors bg-white text-black ${className}`}>
          {children}
        </span>
      );
    }

    /**
     * ============================================================================
     * 2. TextRoll Component (components/ui/text-roll.tsx)
     * ============================================================================
     */
    function TextRoll({
      children,
      className = "",
      center = false,
      stagger = 0.035,
    }) {
      const [isHovered, setIsHovered] = useState(false);
      const str = String(children);
      const chars = str.split("");

      return (
        <span
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          className={`relative block overflow-hidden cursor-pointer select-none text-white/90 hover:text-white ${className}`}
          style={{ lineHeight: 0.9 }}
        >
          {/* Top text slides up on hover */}
          <span className="block">
            {chars.map((char, i) => {
              const delay = center
                ? stagger * Math.abs(i - (chars.length - 1) / 2)
                : stagger * i;

              return (
                <span
                  key={i}
                  className="inline-block transition-transform duration-300 ease-out"
                  style={{
                    transform: isHovered ? "translateY(-100%)" : "translateY(0%)",
                    transitionDelay: `${delay}s`,
                  }}
                >
                  {char === " " ? "\u00A0" : char}
                </span>
              );
            })}
          </span>

          {/* Bottom text slides into view from below */}
          <span className="absolute inset-0 block pointer-events-none" aria-hidden="true">
            {chars.map((char, i) => {
              const delay = center
                ? stagger * Math.abs(i - (chars.length - 1) / 2)
                : stagger * i;

              return (
                <span
                  key={i}
                  className="inline-block transition-transform duration-300 ease-out"
                  style={{
                    transform: isHovered ? "translateY(0%)" : "translateY(100%)",
                    transitionDelay: `${delay}s`,
                  }}
                >
                  {char === " " ? "\u00A0" : char}
                </span>
              );
            })}
          </span>
        </span>
      );
    }

    /**
     * ============================================================================
     * 3. TextScanner Component (components/ui/animated-text-10.tsx)
     * ============================================================================
     */
    function TextScanner({
      text = "SCANNER",
      className = "",
      inkColor = "#ffffff",
      accentColor = "#3b82f6",
      duration = 2.6,
    }) {
      const baseClass = `relative inline-block font-semibold tracking-tight whitespace-pre ${className}`;

      const textStyle = {
        backgroundImage: `linear-gradient(90deg, color-mix(in srgb, ${inkColor} 25%, transparent) 0 40%, ${inkColor} 50%, color-mix(in srgb, ${inkColor} 25%, transparent) 60% 100%)`,
        backgroundSize: '240% 100%',
        WebkitBackgroundClip: 'text',
        backgroundClip: 'text',
        color: 'transparent',
        '--scanner-duration': `${duration}s`,
      };

      const laserStyle = {
        background: accentColor,
        boxShadow: `0 0 14px ${accentColor}`,
        '--scanner-duration': `${duration}s`,
      };

      return (
        <span className={`${baseClass} animate-scanner-text`} style={textStyle}>
          {text}
          <span
            aria-hidden="true"
            className="pointer-events-none absolute -top-1 -bottom-1 w-[2px] animate-scanner-laser"
            style={laserStyle}
          />
        </span>
      );
    }

    /**
     * ============================================================================
     * 3b. FlashlightTextReveal Component (components/ui/flashlight-text-reveal.tsx)
     * ============================================================================
     */
    const SPOTLIGHT = 4;
    const FLASHLIGHT_VERT = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
    `;

    const FLASHLIGHT_FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    uniform vec3 u_colors[8];
    uniform vec4 u_scene;
    uniform vec4 u_shape;
    uniform vec4 u_surface;
    uniform vec4 u_finish;
    uniform vec4 u_transform;
    uniform vec4 u_space;
    uniform vec4 u_cursor;

    #define u_resolution u_scene.xy
    #define u_time u_scene.z
    #define u_colorCount u_scene.w
    #define u_scale u_shape.x
    #define u_intensity u_shape.y
    #define u_paramA u_shape.z
    #define u_warp u_shape.w
    #define u_detail u_surface.x
    #define u_contrast u_surface.y
    #define u_brightness u_surface.z
    #define u_saturation u_surface.w
    #define u_hue u_finish.x
    #define u_vignette u_finish.y
    #define u_blur u_finish.z
    #define u_grain u_finish.w
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    #define u_seed u_transform.x
    #else
    #define u_seed mod(u_transform.x, 31.0)
    #endif
    #define u_rotate u_transform.y
    #define u_drift u_transform.z
    #define u_oklab u_transform.w
    #define u_offset u_space.xy
    #define u_mouse u_space.zw
    #define u_cursorPresence u_cursor.x
    #define u_cursorEffect u_cursor.y
    #define u_cursorStrength u_cursor.z
    #define u_cursorRadius u_cursor.w

    float fl_hash21(vec2 p) {
    #ifndef GL_FRAGMENT_PRECISION_HIGH
      p = mod(p, 31.0);
    #endif
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }

    float fl_grainHash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    vec3 fl_shade(vec2 uv, vec2 p, float t) {
      vec3 acc = u_colors[0] * 0.15;
      float total = 0.15;
      for (int i = 0; i < 8; i++) {
        if (float(i) >= u_colorCount) break;
        float fi = float(i);
        vec2 c = vec2(
          sin(t * (0.21 + fi * 0.071) + fi * 2.4 + u_seed),
          cos(t * (0.17 + fi * 0.093) + fi * 1.7)) * (0.45 + u_intensity * 0.35);
        float w = exp(-dot(p - c, p - c) * 6.0);
        acc += u_colors[i] * w;
        total += w;
      }
      return acc / total;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 screenUv = uv;
      vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy)
        / min(u_resolution.x, u_resolution.y);
      float cursorMask = 0.0;

      if (u_cursorPresence > 0.001) {
        vec2 cursor = (0.5 * u_mouse * u_resolution.xy)
          / min(u_resolution.x, u_resolution.y);
        vec2 cursorDelta = p - cursor;
        float cursorDistance = length(cursorDelta);
        cursorMask = u_cursorPresence * (1.0 - smoothstep(0.0, u_cursorRadius, cursorDistance));
      }

      p *= u_scale;
      if (u_drift > 0.0001)
        p += u_drift * vec2(sin(u_time * 0.31), cos(u_time * 0.23));

      vec3 col = fl_shade(uv, p, u_time);
      if (abs(u_contrast - 1.0) > 0.0001)
        col = (col - 0.5) * u_contrast + 0.5;
      if (u_cursorPresence > 0.001 && u_cursorEffect > 3.5)
        col += (vec3(0.20) + col * 0.15) * cursorMask * u_cursorStrength;
      if (u_grain > 0.0001)
        col += (fl_grainHash(gl_FragCoord.xy + vec2(u_seed * 17.0, u_seed * 31.0)) - 0.5) * u_grain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
    `;

    function fl_hexToRgb(hex) {
      let h = hex.trim().replace(/^#/, "");
      if (h.length === 3) h = h.replace(/./g, "$&$&");
      const n = /^[0-9a-f]{6}$/i.test(h) ? parseInt(h, 16) : 0;
      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
    }

    const FL_FALLOFF = [1, 0.84375, 0.5, 0.15625, 0];

    function fl_lightMask(x, y, radius, presence, ghost) {
      const stops = FL_FALLOFF.map(
        (f, i) => "rgba(0,0,0," + (ghost + (1 - ghost) * f * presence).toFixed(3) + ") " + i * 25 + "%"
      );
      return (
        "radial-gradient(circle " + Math.max(radius, 1).toFixed(1) + "px at " +
        x.toFixed(1) + "px " + y.toFixed(1) + "px, " + stops.join(", ") + ")"
      );
    }

    function fl_wanderAt(t) {
      return [0.62 * Math.sin(t * 0.37), 0.5 * Math.sin(t * 0.53 + 1.3)];
    }

    function fl_compile(gl, vert, frag) {
      const program = gl.createProgram();
      if (!program) return null;
      for (const [type, source] of [
        [gl.VERTEX_SHADER, vert],
        [gl.FRAGMENT_SHADER, frag],
      ]) {
        const shader = gl.createShader(type);
        if (!shader) return null;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.warn(gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          gl.deleteProgram(program);
          return null;
        }
        gl.attachShader(program, shader);
        gl.deleteShader(shader);
      }
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.warn(gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
        return null;
      }
      return program;
    }

    function FlashlightTextReveal({
      text = "FITQUEST\nTRANSCEND\nYOUR\nLIMITS",
      textColor = "#f4f4f5",
      ghost = 0.04,
      fontFamily = '"Anton", "Syne", "Plus Jakarta Sans", Impact, sans-serif',
      fontSize = "clamp(3.5rem, 11vw, 9.5rem)",
      wander = true,
      radius = 0.35,
      strength = 1.15,
      colors = ["#000000", "#141416", "#252836"],
      speed = 0.86,
      scale = 2.5,
      height = "100vh",
      children,
    }) {
      const canvasRef = useRef(null);
      const writingRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
        if (!gl) return;
        const program = fl_compile(gl, FLASHLIGHT_VERT, FLASHLIGHT_FRAG);
        if (!program) return;

        const triangleBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const position = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
        gl.useProgram(program);

        const u = (name) => gl.getUniformLocation(program, name);
        const loc = {
          colors: u("u_colors"),
          scene: u("u_scene"),
          shape: u("u_shape"),
          surface: u("u_surface"),
          finish: u("u_finish"),
          transform: u("u_transform"),
          space: u("u_space"),
          cursor: u("u_cursor"),
        };
        const colorData = new Float32Array(24);
        colors.forEach((hex, i) => colorData.set(fl_hexToRgb(hex), i * 3));

        const pointer = { x: 0, y: 0, inside: false };
        const light = { x: 0, y: 0 };
        let presence = 0, time = 0, roam = 0, last = 0, raf = 0;

        const draw = (now) => {
          const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
          last = now;
          if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
          }
          time += dt * speed;
          roam += dt;

          const [tx, ty] = pointer.inside ? [pointer.x, pointer.y] : wander ? fl_wanderAt(roam) : [0, 0];
          const on = pointer.inside || wander ? 1 : 0;
          light.x += (tx - light.x) * (1 - Math.exp(-dt / 0.12));
          light.y += (ty - light.y) * (1 - Math.exp(-dt / 0.12));
          presence += (on - presence) * (1 - Math.exp(-dt / 0.22));

          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform3fv(loc.colors, colorData);
          gl.uniform4f(loc.scene, canvas.width, canvas.height, time, colors.length);
          gl.uniform4f(loc.shape, scale, 0.59, 0.5, 0);
          gl.uniform4f(loc.surface, 2.4, 0.91, -0.1, 1);
          gl.uniform4f(loc.finish, 6.28, 0, 0.016, 0.16);
          gl.uniform4f(loc.transform, 1, 0, 0.03, 0);
          gl.uniform4f(loc.space, 0, 0, light.x, light.y);
          gl.uniform4f(loc.cursor, presence, SPOTLIGHT, strength, radius);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          if (writingRef.current) {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const mask = fl_lightMask(((light.x + 1) / 2) * w, ((1 - light.y) / 2) * h, radius * Math.min(w, h), presence, ghost);
            writingRef.current.style.maskImage = mask;
            writingRef.current.style.webkitMaskImage = mask;
          }
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);

        const onMove = (e) => {
          const r = canvas.getBoundingClientRect();
          pointer.inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
          pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          pointer.y = 1 - ((e.clientY - r.top) / r.height) * 2;
        };
        window.addEventListener("pointermove", onMove, { passive: true });

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener("pointermove", onMove);
          gl.deleteBuffer(triangleBuffer);
          gl.deleteProgram(program);
        };
      }, []);

      return (
        <section className="relative w-full overflow-hidden select-none" style={{ height, background: colors[0] }}>
          <canvas ref={canvasRef} className="pointer-events-none absolute inset-0 block h-full w-full z-0" />
          <div
            ref={writingRef}
            className="absolute inset-0 flex items-center justify-center px-6 text-center select-none pointer-events-none z-10"
            style={{
              color: textColor,
              fontFamily,
              fontSize,
              lineHeight: 0.88,
              letterSpacing: "0.02em",
              whiteSpace: "pre-line",
            }}
          >
            <p className="m-0 font-normal uppercase">{text}</p>
          </div>
          {children && <div className="relative z-20 h-full w-full pointer-events-auto">{children}</div>}
        </section>
      );
    }

    /**
     * ============================================================================
     * 4. 3D Stacked Carousel Component (components/ui/carousel-07.tsx)
     * ============================================================================
     */
    const slidesData = [
      {
        image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=800&auto=format&fit=crop",
        title: "17-Point Pose Vision",
        description: "Sub-millimeter skeletal tracking audits joint angles and bar-path vectors at 120 FPS.",
        badge: "Computer Vision",
      },
      {
        image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=800&auto=format&fit=crop",
        title: "3-1-1 Hypertrophy Tempo",
        description: "Enforces strict 3-second eccentric control and explosive concentric drive.",
        badge: "Hypertrophy",

    function CarouselStacked() {
      const [progress, setProgress] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startX = useRef(0);
      const startProgress = useRef(0);
      const total = slidesData.length;

      const handleMouseDown = (e) => {
        setIsDragging(true);
        startX.current = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        startProgress.current = progress;
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const delta = currentX - startX.current;
        setProgress(startProgress.current - delta / 180);
      };

      const handleMouseUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        const target = Math.round(progress);
        setProgress(target);
      };

      const nextSlide = () => setProgress(p => Math.round(p) + 1);
      const prevSlide = () => setProgress(p => Math.round(p) - 1);

      return (
        <div className="flex flex-col items-center justify-center w-full py-12 bg-black select-none overflow-hidden">
          <div className="text-center mb-6">
            <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
              02 // KINEMATIC STREAM
            </span>
            <h3 className="text-xl font-bold text-white tracking-tight">FitQuest Biomechanical Architecture</h3>
            <p className="text-xs text-zinc-400">Interactive 3D stacked deck: Computer vision form tracking, tempo control, and streak defense</p>
          </div>

          <div
            className="relative w-full max-w-5xl h-80 sm:h-96 lg:h-[420px] flex items-center justify-center cursor-grab active:cursor-grabbing"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onTouchStart={handleMouseDown}
            onTouchMove={handleMouseMove}
            onTouchEnd={handleMouseUp}
          >
            {slidesData.map((slide, i) => {
              let diff = (i - progress) % total;
              if (diff > total / 2) diff -= total;
              if (diff < -total / 2) diff += total;

              const xOffset = diff * 160;
              const yOffset = Math.abs(diff) * 25;
              const rotation = diff * 10;
              const scale = 1 - Math.abs(diff) * 0.1;
              const opacity = Math.abs(diff) > 2.4 ? 0 : 1 - Math.abs(diff) * 0.25;
              const zIndex = Math.round(100 - Math.abs(diff) * 10);

              return (
                <div
                  key={i}
                  style={{
                    transform: `translate3d(${xOffset}px, ${yOffset}px, 0) rotate(${rotation}deg) scale(${scale})`,
                    opacity: opacity,
                    zIndex: zIndex,
                    transition: isDragging ? "none" : "transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease",
                  }}
                  className="absolute rounded-2xl overflow-hidden bg-zinc-900 border border-white/[0.08] shadow-2xl w-48 h-64 sm:w-60 sm:h-80 lg:w-72 lg:h-96 pointer-events-none group"
                >
                  <img
                    src={slide.image}
                    alt={slide.title}
                    className="absolute inset-0 w-full h-full object-cover"
                    loading="lazy"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/25 to-transparent" />
                  
                  <div className="absolute top-4 right-4">
                    <Badge className="bg-white/90 text-black text-[10px] font-bold shadow-md">
                      {slide.badge}
                    </Badge>
                  </div>

                  <div className="absolute bottom-5 left-4 right-4 text-white">
                    <h4 className="text-base sm:text-lg font-bold leading-tight drop-shadow-md">
                      {slide.title}
                    </h4>
                    <p className="text-xs text-zinc-300 line-clamp-2 mt-1 font-normal opacity-90">
                      {slide.description}
                    </p>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex items-center gap-4 mt-6">
            <button
              onClick={prevSlide}
              className="p-2.5 rounded-full bg-white/[0.04] border border-white/[0.08] hover:bg-white/[0.1] text-zinc-300 hover:text-white transition-all"
              aria-label="Previous card"
            >
              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span className="font-mono text-xs text-zinc-500 tracking-wider">
              DRAG OR CLICK TO CYCLE
            </span>
            <button
              onClick={nextSlide}
              className="p-2.5 rounded-full bg-white/[0.04] border border-white/[0.08] hover:bg-white/[0.1] text-zinc-300 hover:text-white transition-all"
              aria-label="Next card"

              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      );

    /**
     * ============================================================================
     * 5. MagneticButton Primitive (components/ui/motion-footer.tsx)
     * ============================================================================
     */
    function MagneticButton({ children, className = "", as = "button", onClick, href, target }) {
      const btnRef = useRef(null);

      useEffect(() => {
        const el = btnRef.current;
        if (!el || !window.gsap) return;

        const onMove = (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          gsap.to(el, {
            x: x * 0.35,
            y: y * 0.35,
            rotationX: -y * 0.1,
            rotationY: x * 0.1,
            scale: 1.04,
            duration: 0.3,
            ease: "power2.out",
          });
        };

        const onLeave = () => {
          gsap.to(el, {
            x: 0,
            y: 0,
            rotationX: 0,
            rotationY: 0,
            scale: 1,
            duration: 0.8,
            ease: "elastic.out(1, 0.3)",
          });
        };

        el.addEventListener("mousemove", onMove);
        el.addEventListener("mouseleave", onLeave);
        return () => {
          el.removeEventListener("mousemove", onMove);
          el.removeEventListener("mouseleave", onLeave);
        };
      }, []);

      const Component = as;
      return (
        <Component
          ref={btnRef}
          onClick={onClick}
          href={href}
          target={target}
          className={`cursor-pointer ${className}`}
        >
          {children}
        </Component>
      );
    }

            <section id="biomechanics" className="w-full max-w-6xl mx-auto px-6 py-24 space-y-8">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/[0.08] pb-6">
                <div>
                  <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
                    SYNOPSIS PILLAR 01 // COMPUTER VISION
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                    Interactive 3D Biomechanics &amp; Form Guide
                  </h2>
                </div>
                
                {/* Exercise Switcher */}
                <div className="flex gap-2">
                  {Object.keys(exercises).map((key) => (
                    <button
                      key={key}
                      onClick={() => setExercise(key)}
                      className={`px-4 py-2 rounded-xl text-xs font-mono uppercase tracking-wider transition-all ${
                        exercise === key
                          ? "bg-white text-black font-bold shadow-md shadow-white/10"
                          : "bg-white/[0.04] border border-white/[0.08] text-zinc-400 hover:text-white"
                      }`}
                    >
                      {exercises[key].name.split(" ")[1] || exercises[key].name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center bg-white/[0.02] p-8 rounded-3xl border border-white/[0.06]">
                
                {/* Left Telemetry Column */}
                <div className="lg:col-span-5 space-y-6">
                  <div>
                    <Badge className="bg-blue-500/20 text-blue-400 border-blue-500/30 mb-2">
                      120 FPS Pose Vision
                    </Badge>
                    <h3 className="text-2xl font-bold text-white tracking-tight">
                      {currentEx.name}
                    </h3>
                    <p className="text-xs text-zinc-400 font-normal mt-1 leading-relaxed">
                      Skeletal computer vision estimates 17 anatomical keypoints, inspecting joint neutrality, depth, and bar-path velocity vectors.
                    </p>
                  </div>

                  {/* Dynamic Joint Angle Telemetry */}
                  <div className="space-y-3 p-5 rounded-2xl bg-black border border-white/[0.08]">
                    <div className="flex items-center justify-between text-xs font-mono text-zinc-400 pb-2 border-b border-white/[0.06]">
                      <span>JOINT AXIS</span>
                      <span>TELEMETRY</span>
                    </div>
                    {Object.entries(currentEx.angles).map(([k, v]) => (
                      <div key={k} className="flex items-center justify-between text-xs font-mono">
                        <span className="text-zinc-400 uppercase">{k} ANGLE</span>
                        <span className="text-white font-bold">{v}</span>
                      </div>
                    ))}
                    <div className="flex items-center justify-between text-xs font-mono pt-2 border-t border-white/[0.06]">
                      <span className="text-zinc-400 uppercase">TEMPO ENFORCEMENT</span>
                      <span className="text-blue-400 font-bold">{currentEx.tempo}</span>
                    </div>
                    <div className="flex items-center justify-between text-xs font-mono">
                      <span className="text-zinc-400 uppercase">VALGUS SAFETY</span>
                      <span className="text-emerald-400 font-bold">{currentEx.status}</span>
                    </div>
                  </div>

                  {/* 360 Camera Angle Buttons */}
                  <div className="flex items-center gap-2 text-xs font-mono text-zinc-400">
                    <span>CAMERA VIEW:</span>
                    {["sagittal", "frontal", "isometric"].map((v) => (
                      <button
                        key={v}
                        onClick={() => setViewAngle(v)}
                        className={`px-2.5 py-1 rounded-md text-[10px] uppercase transition-all ${
                          viewAngle === v
                            ? "bg-white text-black font-bold"
                            : "bg-white/[0.04] text-zinc-400 hover:text-white"
                        }`}
                      >
                        {v}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Right Interactive Visualizer Column */}
                <div className="lg:col-span-7 relative rounded-2xl overflow-hidden border border-white/[0.08] h-96 lg:h-[420px] bg-zinc-950">
                  <img
                    src={currentEx.image}
                    alt={currentEx.name}
                    className="w-full h-full object-cover opacity-80"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent" />
                  
                  {/* Real-time Skeleton Overlay Mockup */}
                  <div className="absolute top-4 left-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/70 border border-white/20 text-[10px] font-mono text-emerald-400">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                    <span>SKELETAL 17-KEYPOINT HUD ACTIVE</span>
                  </div>

                  {/* Cadence Pulse */}
                  <div className="absolute bottom-5 left-5 right-5 flex items-center justify-between bg-black/80 backdrop-blur-md p-4 rounded-xl border border-white/10">
                    <div>
                      <span className="text-[10px] font-mono text-zinc-400 block uppercase">CADENCE GUIDE</span>
                      <span className="text-xs font-mono font-bold text-white">3s Eccentric • 1s Pause • 1s Concentric</span>
                    </div>
                    <span className="text-xs font-mono text-blue-400 font-bold">120 FPS SYNC</span>
                  </div>
                </div>

              </div>
            </section>

            {/* ── 5. FEATURE 2: DUOLINGO-CLASS HABIT & STREAK ENGINE ── */}
            <section id="streak" className="w-full max-w-6xl mx-auto px-6 py-24 space-y-8 border-t border-white/[0.06]">
              <div className="border-b border-white/[0.08] pb-6">
                <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
                  SYNOPSIS PILLAR 02 // GAMIFIED PSYCHOLOGY
                </span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                  Duolingo-Class Habit &amp; Streak Engine
                </h2>
                <p className="text-xs text-zinc-400 mt-2">
                  Zero habit dropout. Loss aversion psychology, streak freeze protection shields, and compounding XP multipliers.
                </p>
              </div>

              {/* Milestone Tabs */}
              <div className="flex flex-wrap gap-3">
                {[7, 30, 100, 365].map((d) => (
                  <button
                    key={d}
                    onClick={() => setStreakDays(d)}
                    className={`px-5 py-3 rounded-2xl text-xs font-mono font-bold uppercase transition-all ${
                      streakDays === d
                        ? "bg-orange-500 text-black shadow-lg shadow-orange-500/20 scale-105"
                        : "bg-white/[0.04] border border-white/[0.08] text-zinc-300 hover:text-white"
                    }`}
                  >
                    🔥 {d} DAYS STREAK
                  </button>
                ))}
              </div>

              {/* Milestone Details Card */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 p-8 rounded-3xl bg-white/[0.02] border border-white/[0.06]">
                <div className="space-y-1 p-4 rounded-2xl bg-black border border-white/[0.08]">
                  <span className="text-[10px] font-mono text-zinc-500 uppercase">XP MULTIPLIER</span>
                  <p className="text-2xl font-bold text-white">{streakDays === 7 ? "1.25x XP" : streakDays === 30 ? "2.0x XP" : streakDays === 100 ? "3.2x XP" : "5.0x XP (MAX)"}</p>
                </div>
                <div className="space-y-1 p-4 rounded-2xl bg-black border border-white/[0.08]">
                  <span className="text-[10px] font-mono text-zinc-500 uppercase">FREEZE PROTECTION</span>
                  <p className="text-2xl font-bold text-blue-400">{streakDays === 7 ? "1 Shield" : streakDays === 30 ? "3 Shields" : streakDays === 100 ? "7 Shields" : "Infinite Shields"}</p>
                </div>
                <div className="space-y-1 p-4 rounded-2xl bg-black border border-white/[0.08]">
                  <span className="text-[10px] font-mono text-zinc-500 uppercase">UNLOCKED TIER</span>
                  <p className="text-2xl font-bold text-orange-400">{streakDays === 7 ? "Novice Fire" : streakDays === 30 ? "Iron Discipline" : streakDays === 100 ? "Centurion Flame" : "Titan Immortal"}</p>
                </div>
                <div className="space-y-1 p-4 rounded-2xl bg-black border border-white/[0.08]">
                  <span className="text-[10px] font-mono text-zinc-500 uppercase">DROPOUT PROBABILITY</span>
                  <p className="text-2xl font-bold text-emerald-400">{streakDays === 7 ? "14.2%" : streakDays === 30 ? "3.8%" : streakDays === 100 ? "0.6%" : "0.01% (LOCKED IN)"}</p>
                </div>
              </div>
            </section>

            {/* ── 6. FEATURE 3: LIVE EXPERT VIDEO UPLINK (WEBRTC) ── */}
            <section id="coaching" className="w-full max-w-6xl mx-auto px-6 py-24 space-y-8 border-t border-white/[0.06]">
              <div className="border-b border-white/[0.08] pb-6">
                <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
                  SYNOPSIS PILLAR 03 // WEBRTC TELEMEDICINE
                </span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                  Live Expert Video Uplink (WebRTC Simulation)
                </h2>
                <p className="text-xs text-zinc-400 mt-2">
                  1-on-1 on-demand coaching interface connecting athletes with CSCS certified trainers and physiotherapists for live rep audits.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {trainers.map((tr, idx) => (
                  <div key={idx} className="p-6 rounded-2xl bg-white/[0.02] border border-white/[0.08] flex flex-col justify-between space-y-4">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-mono text-emerald-400 font-bold">● {tr.status}</span>
                        <span className="text-xs font-mono text-zinc-400">★ {tr.rating}</span>
                      </div>
                      <h4 className="text-base font-bold text-white">{tr.name}</h4>
                      <p className="text-xs text-zinc-400 font-normal">{tr.spec}</p>
                    </div>

                    <div className="pt-4 border-t border-white/[0.06] flex items-center justify-between">
                      <span className="text-[11px] font-mono text-zinc-500">{tr.calls}</span>
                      <button
                        onClick={() => setCallingTrainer(tr)}
                        className="px-3.5 py-1.5 rounded-lg bg-white text-black font-semibold text-xs hover:bg-zinc-200 transition-colors"
                      >
                        Call Coach
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {/* Active Call Modal Simulation */}
              {callingTrainer && (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-6">
                  <div className="w-full max-w-md p-8 rounded-3xl bg-zinc-950 border border-white/20 text-center space-y-6">
                    <span className="w-3 h-3 rounded-full bg-emerald-400 animate-ping inline-block" />
                    <div>
                      <h3 className="text-xl font-bold text-white">{callingTrainer.name}</h3>
                      <p className="text-xs text-zinc-400">{callingTrainer.spec}</p>
                    </div>
                    <div className="p-4 rounded-xl bg-black border border-white/10 font-mono text-xs text-emerald-400">
                      WEBRTC P2P ENCRYPTION ESTABLISHED // 1080P 60 FPS
                    </div>
                    <button
                      onClick={() => setCallingTrainer(null)}
                      className="w-full py-3 rounded-xl bg-red-600 text-white font-bold text-xs uppercase tracking-wider hover:bg-red-500 transition-colors"
                    >
                      END SESSION
                    </button>
                  </div>
                </div>
              )}
            </section>

            {/* ── 7. FEATURE 4: REAL-TIME REDIS LEADERBOARD ── */}
            <section id="leaderboard" className="w-full max-w-6xl mx-auto px-6 py-24 space-y-8 border-t border-white/[0.06]">
              <div className="border-b border-white/[0.08] pb-6">
                <span className="text-[11px] font-mono text-zinc-500 uppercase tracking-widest block mb-1">
                  SYNOPSIS PILLAR 04 // REAL-TIME IN-MEMORY DATA
                </span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                  Real-time Redis Leaderboard
                </h2>
                <p className="text-xs text-zinc-400 mt-2">
                  Global, Guild Squad, and Gym Club ranking table powered by sub-5ms Redis in-memory sorted sets.
                </p>
              </div>

              <div className="w-full rounded-2xl bg-white/[0.02] border border-white/[0.08] overflow-hidden">
                <div className="grid grid-cols-12 p-4 text-[11px] font-mono text-zinc-500 border-b border-white/[0.06] uppercase">
                  <div className="col-span-2">RANK</div>
                  <div className="col-span-4">ATHLETE</div>
                  <div className="col-span-3">STREAK</div>
                  <div className="col-span-3 text-right">XP SCORE</div>
                </div>

                <div className="divide-y divide-white/[0.04]">
                  {leaderboards.map((row) => (
                    <div
                      key={row.rank}
                      className={`grid grid-cols-12 p-4 text-xs font-mono items-center transition-colors ${
                        row.highlight
                          ? "bg-white/[0.08] text-white font-bold"
                          : "text-zinc-300 hover:bg-white/[0.02]"
                      }`}
                    >
                      <div className="col-span-2 font-bold text-zinc-400">#{row.rank}</div>
                      <div className="col-span-4 flex items-center gap-2">
                        <span>{row.name}</span>
                        {row.highlight && (
                          <span className="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-mono">YOU</span>
                        )}
                      </div>
                      <div className="col-span-3 text-orange-400 font-semibold">{row.streak}</div>
                      <div className="col-span-3 text-right font-bold text-white">{row.xp}</div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* ── 8. SCROLL PROMPT FOR CURTAIN REVEAL FOOTER ── */}
            <div className="pb-16 pt-8 flex flex-col items-center border-t border-white/[0.06]">
              <p className="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-4">
                SCROLL DOWN TO REVEAL CURTAIN FOOTER
              </p>
              <div className="w-[1px] h-20 bg-gradient-to-b from-zinc-500 to-transparent animate-pulse" />
            </div>

          </div>

          {/* ── 9. CINEMATIC CURTAIN REVEAL FOOTER ── */}
          <CinematicFooter brand="FITQUEST" />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
